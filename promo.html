  <style>

    body {

</head>
<body>

  <div class="header-bar">
    <h1>?렗 ?몃?紐?15珥?紐⑥뀡洹몃옒??愿묎퀬 ?꾨━酉?/h1>
    <p>?몄뒪? 由댁뒪 쨌 ?좏뒠釉??쇱툩 洹쒓꺽 (9:16 ?몃줈?? / ?좊땲硫붿씠??+ BGM + ?곸긽 ?ㅼ슫濡쒕뱶</p>
  </div>

  <div class="player-wrapper">
    <canvas id="motionCanvas" width="720" height="1280"></canvas>
  </div>

  <div class="controls-bar">
    <button id="btnPlayPause" class="btn-ctrl primary">

      <span id="playText">?쇱떆?뺤?</span>

    <button id="btnReplay" class="btn-ctrl">
      ?봽 ?ㅼ떆蹂닿린
    </button>

      ?뵄 BGM 耳쒖쭚
    </button>

    <button id="btnExport" class="btn-ctrl" style="background:#2563EB; color:#FFF;">
      ?뱿 ?곸긽 ?뚯씪 ?ㅼ슫濡쒕뱶 (.webm)
    </button>
  </div>

  <script>
    const canvas = document.getElementById('motionCanvas');
    const ctx = canvas.getContext('2d');
    const W = 720;
    const H = 1280;

    const DURATION = 15.0; // 15珥?    let currentTime = 0;
    let isPlaying = true;
    let audioEnabled = true;
    let lastTimestamp = null;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playBeep(freq = 440, type = 'sine', duration = 0.12, gainVal = 0.08) {
      if (!audioEnabled || !audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    let lastTriggeredBeat = -1;
    function checkAudioBeats(t) {
      if (!audioEnabled) return;
      const beatIndex = Math.floor(t * 4); // 120 BPM 由щ벉
      if (beatIndex !== lastTriggeredBeat) {
        lastTriggeredBeat = beatIndex;
        if (beatIndex % 4 === 0) {
          playBeep(130, 'triangle', 0.15, 0.12); // Kick
        } else if (beatIndex % 2 === 0) {
          playBeep(880, 'sine', 0.08, 0.04); // Snare
        } else {
          playBeep(520, 'sine', 0.05, 0.02);
        }

        // ???꾪솚 ??李⑥엫
        if (Math.abs(t - 3.8) < 0.15 || Math.abs(t - 7.5) < 0.15 || Math.abs(t - 11.2) < 0.15) {
          playBeep(659.25, 'sine', 0.35, 0.18);
          setTimeout(() => playBeep(880, 'triangle', 0.4, 0.2), 80);
        }
      }
    }

    function easeOutBack(x) {
      const c1 = 1.70158;
      const c3 = c1 + 1;
      return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
    }

    function renderFrame(t) {
      ctx.clearRect(0, 0, W, H);
      const progress = Math.min(1, t / DURATION);

      // ==========================================
      // [SCENE 1: 0.0s ~ 3.8s] 怨듦컯 ?쒓컙 ?몃줈? & ?숈떇 怨좊?
      // ==========================================
      if (t < 4.0) {
        const fadeOut = t > 3.4 ? (4.0 - t) / 0.6 : 1;

        const grad = ctx.createLinearGradient(0, 0, 0, H);
        grad.addColorStop(0, '#0F172A');
        grad.addColorStop(1, '#1E293B');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);

        ctx.save();
        ctx.globalAlpha = Math.max(0, fadeOut);

        // ?쒓퀎 ?쒓컖??        const clockScale = easeOutBack(Math.min(1, t / 0.8));
        ctx.save();
        ctx.translate(W / 2, 380);
        ctx.scale(clockScale, clockScale);

        ctx.strokeStyle = '#38BDF8';
        ctx.lineWidth = 14;
        ctx.beginPath();
        ctx.arc(0, 0, 110, 0, Math.PI * 2);
        ctx.stroke();

        const handAngle = t * Math.PI * 2.5;
        ctx.strokeStyle = '#F1F5F9';
        ctx.lineWidth = 8;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(handAngle) * 75, Math.sin(handAngle) * 75);
        ctx.stroke();

        ctx.fillStyle = '#38BDF8';
        ctx.beginPath();
        ctx.arc(0, 0, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // ?띿뒪??1
        if (t > 0.3) {
          const t1Progress = easeOutBack(Math.min(1, (t - 0.3) / 0.5));
          ctx.save();
          ctx.translate(W / 2, 600);
          ctx.scale(t1Progress, t1Progress);
          ctx.fillStyle = '#94A3B8';
          ctx.font = '800 38px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('?ㅻ뒛 怨듦컯 3?쒓컙...', 0, 0);
          ctx.restore();
        }

        // ?띿뒪??2
        if (t > 1.3) {
          const t2Progress = easeOutBack(Math.min(1, (t - 1.3) / 0.6));
          const shake = t > 1.3 && t < 1.8 ? Math.sin(t * 40) * 4 : 0;
          ctx.save();
          ctx.translate(W / 2 + shake, 690);
          ctx.scale(t2Progress, t2Progress);
          ctx.fillStyle = '#FFFFFF';
          ctx.font = '900 56px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('?숈떇 ?꾧뎄??癒뱀?? ?뜖', 0, 0);
          ctx.restore();
        }

        // 留먰뭾??移?        if (t > 2.2) {
          const chipScale = easeOutBack(Math.min(1, (t - 2.2) / 0.5));
          ctx.save();
          ctx.translate(W / 2, 830);
          ctx.scale(chipScale, chipScale);

          ctx.fillStyle = 'rgba(239, 68, 68, 0.2)';
          ctx.strokeStyle = '#EF4444';
          ctx.lineWidth = 3;
          drawRoundedRect(ctx, -240, -45, 480, 90, 45);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = '#FCA5A5';
          ctx.font = '800 32px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('?쇰갈? 議곌툑 ?ъ떖?쒕뜲... ?삟', 0, 12);
          ctx.restore();
        }

        ctx.restore();
      }

      // ==========================================
      // [SCENE 2: 3.8s ~ 7.5s] 移댄넚 NO! ?ㅻ챸 NO! ?덉떖 蹂댄샇 ?쒖뒪??      // ==========================================
      if (t >= 3.6 && t < 7.7) {
        const s2t = t - 3.8;
        const fadeIn = s2t < 0.4 ? s2t / 0.4 : (t > 7.2 ? (7.7 - t) / 0.5 : 1);

        const grad = ctx.createLinearGradient(0, 0, 0, H);
        grad.addColorStop(0, '#1E293B');
        grad.addColorStop(1, '#064E3B');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);

        ctx.save();
        ctx.globalAlpha = Math.max(0, fadeIn);

        const headerScale = easeOutBack(Math.min(1, Math.max(0, s2t / 0.5)));
        ctx.save();
        ctx.translate(W / 2, 280);
        ctx.scale(headerScale, headerScale);
        ctx.fillStyle = '#F87171';
        ctx.font = '900 42px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('移댄넚 ID 援먰솚? ?솀?띯셽截?, 0, 0);
        ctx.fillStyle = '#CBD5E1';
        ctx.font = '800 36px sans-serif';
        ctx.fillText('?ㅻ챸쨌?꾪솕踰덊샇 怨듦컻? NO!', 0, 56);
        ctx.restore();

        if (s2t > 1.0) {
          const shieldScale = easeOutBack(Math.min(1, (s2t - 1.0) / 0.6));
          ctx.save();
          ctx.translate(W / 2, 540);
          ctx.scale(shieldScale, shieldScale);

          ctx.fillStyle = 'rgba(16, 185, 129, 0.2)';
          ctx.strokeStyle = '#10B981';
          ctx.lineWidth = 8;
          ctx.beginPath();
          ctx.arc(0, 0, 95, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          ctx.font = '84px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('?썳截?, 0, 30);
          ctx.restore();
        }

        if (s2t > 1.8) {
          const gaugeScale = easeOutBack(Math.min(1, (s2t - 1.8) / 0.5));
          ctx.save();
          ctx.translate(W / 2, 770);
          ctx.scale(gaugeScale, gaugeScale);

          ctx.fillStyle = '#1E293B';
          ctx.strokeStyle = '#34D399';
          ctx.lineWidth = 4;
          drawRoundedRect(ctx, -260, -90, 520, 180, 24);
          ctx.fill();
          ctx.stroke();

          const tempProgress = Math.min(1, (s2t - 1.8) / 1.2);
          const currentTemp = (36.5 + tempProgress * 3.5).toFixed(1);

          ctx.fillStyle = '#F8FAFC';
          ctx.font = '800 30px sans-serif';
          ctx.textAlign = 'left';
          ctx.fillText('?몄궛? ?덉떖 留ㅻ꼫?⑤룄', -220, -35);

          ctx.fillStyle = '#34D399';
          ctx.font = '900 36px sans-serif';
          ctx.textAlign = 'right';
          ctx.fillText(`?뙜截?${currentTemp}째C`, 220, -35);

          ctx.fillStyle = '#334155';
          drawRoundedRect(ctx, -220, 10, 440, 22, 11);
          ctx.fill();

          ctx.fillStyle = '#10B981';
          drawRoundedRect(ctx, -220, 10, 440 * (tempProgress * 0.6 + 0.35), 22, 11);
          ctx.fill();

          ctx.fillStyle = '#94A3B8';
          ctx.font = '700 22px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('?섎씫 ??100% 釉붾씪?몃뱶 ?꾨줈??蹂댄샇', 0, 62);

          ctx.restore();
        }

        ctx.restore();
      }

      // ==========================================
      // [SCENE 3: 7.5s ~ 11.2s] ?ㅼ떆媛?罹좏띁??踰덇컻 吏??& ?숈떇쨌移닿났쨌寃뚯엫
      // ==========================================
      if (t >= 7.3 && t < 11.5) {
        const s3t = t - 7.5;
        const fadeIn = s3t < 0.4 ? s3t / 0.4 : (t > 11.0 ? (11.5 - t) / 0.5 : 1);

        const grad = ctx.createLinearGradient(0, 0, 0, H);
        grad.addColorStop(0, '#064E3B');
        grad.addColorStop(1, '#042F2E');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);

        ctx.save();
        ctx.globalAlpha = Math.max(0, fadeIn);

        const titleScale = easeOutBack(Math.min(1, Math.max(0, s3t / 0.5)));
        ctx.save();
        ctx.translate(W / 2, 240);
        ctx.scale(titleScale, titleScale);
        ctx.fillStyle = '#6EE7B7';
        ctx.font = '900 48px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('?몄궛? ?ㅼ떆媛?踰덇컻 吏????, 0, 0);
        ctx.restore();

        const chips = [
          { text: '?뜗 22?멸? ?숈깮?앸떦 ?숈떇 媛숈씠 癒뱀뼱??', delay: 0.5, y: 390, color: '#FEF3C7', border: '#F59E0B', fontColor: '#92400E' },
          { text: '??16?멸? ?꾩궛?꾩꽌愿 2?쒓컙 吏묒쨷 移닿났!', delay: 1.1, y: 520, color: '#DBEAFE', border: '#3B82F6', fontColor: '#1E40AF' },
          { text: '?렜 諛붾낫?ш굅由?濡????/ 寃뚯엫 踰덇컻!', delay: 1.7, y: 650, color: '#EDE9FE', border: '#8B5CF6', fontColor: '#5B21B6' }
        ];

        chips.forEach(chip => {
          if (s3t > chip.delay) {
            const sc = easeOutBack(Math.min(1, (s3t - chip.delay) / 0.5));
            ctx.save();
            ctx.translate(W / 2, chip.y);
            ctx.scale(sc, sc);

            ctx.fillStyle = chip.color;
            ctx.strokeStyle = chip.border;
            ctx.lineWidth = 3;
            drawRoundedRect(ctx, -280, -45, 560, 90, 20);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = chip.fontColor;
            ctx.font = '800 28px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(chip.text, 0, 10);
            ctx.restore();
          }
        });

        if (s3t > 2.3) {
          const pulseT = (s3t - 2.3) * 2;
          const radarRadius = (pulseT % 1.5) * 80;
          const radarAlpha = Math.max(0, 1 - (pulseT % 1.5) / 1.5);

          ctx.save();
          ctx.translate(W / 2, 870);

          ctx.strokeStyle = `rgba(52, 211, 153, ${radarAlpha})`;
          ctx.lineWidth = 6;
          ctx.beginPath();
          ctx.arc(0, 0, radarRadius + 40, 0, Math.PI * 2);
          ctx.stroke();

          ctx.fillStyle = '#10B981';
          ctx.beginPath();
          ctx.arc(0, 0, 36, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#FFFFFF';
          ctx.lineWidth = 5;
          ctx.stroke();

          ctx.font = '36px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('?뱧', 0, 12);

          ctx.fillStyle = '#FFFFFF';
          ctx.font = '800 30px sans-serif';
          ctx.fillText('?꾩옱 ?곕━ ?숆탳 紐⑥쭛 以?踰덇컻 4嫄?, 0, 80);

          ctx.restore();
        }

        ctx.restore();
      }

      // ==========================================
      // [SCENE 4: 11.2s ~ 15.0s] 而ㅽ뵾 由ъ썙??& 理쒖쥌 濡쒓퀬 ?붾뵫 (CTA)
      // ==========================================
      if (t >= 11.0) {
        const s4t = t - 11.2;
        const fadeIn = s4t < 0.4 ? s4t / 0.4 : 1;

        const grad = ctx.createLinearGradient(0, 0, 0, H);
        grad.addColorStop(0, '#1E634C');
        grad.addColorStop(0.6, '#287D62');
        grad.addColorStop(1, '#115E59');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);

        ctx.save();
        ctx.globalAlpha = Math.max(0, fadeIn);

        const ticketScale = easeOutBack(Math.min(1, Math.max(0, s4t / 0.6)));
        ctx.save();
        ctx.translate(W / 2, 340);
        ctx.scale(ticketScale, ticketScale);

        ctx.fillStyle = '#FEF3C7';
        ctx.strokeStyle = '#F59E0B';
        ctx.lineWidth = 6;
        drawRoundedRect(ctx, -260, -90, 520, 180, 24);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#D97706';
        ctx.font = '900 30px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('?럞 泥?踰덇컻 ?꾨즺 蹂대꼫??, 0, -32);

        ctx.fillStyle = '#78350F';
        ctx.font = '900 36px sans-serif';
        ctx.fillText('硫붽?쨌而댄룷利??꾨찓由ъ뭅??異붿꺼沅??렅截?, 0, 18);

        ctx.fillStyle = '#92400E';
        ctx.font = '700 24px sans-serif';
        ctx.fillText('留ㅻ꼫?⑤룄 +1.0째C 利됱떆 蹂대꼫???곸듅!', 0, 58);
        ctx.restore();

        if (s4t > 1.0) {
          const logoScale = easeOutBack(Math.min(1, (s4t - 1.0) / 0.6));
          ctx.save();
          ctx.translate(W / 2, 680);
          ctx.scale(logoScale, logoScale);

          ctx.fillStyle = '#FFFFFF';
          drawRoundedRect(ctx, -70, -70, 140, 140, 36);
          ctx.fill();

          ctx.font = '80px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('?뙮', 0, 28);

          ctx.fillStyle = '#FFFFFF';
          ctx.font = '900 72px sans-serif';
          ctx.fillText('?몃?紐?, 0, 140);

          ctx.fillStyle = '#D1FAE5';
          ctx.font = '800 32px sans-serif';
          ctx.fillText('?몄궛?????紐⑥뿬??', 0, 195);
          ctx.restore();
        }

        if (s4t > 1.8) {
          const ctaScale = easeOutBack(Math.min(1, (s4t - 1.8) / 0.5));
          ctx.save();
          ctx.translate(W / 2, 1020);
          ctx.scale(ctaScale, ctaScale);

          ctx.fillStyle = '#FFFFFF';
          drawRoundedRect(ctx, -240, -42, 480, 84, 42);
          ctx.fill();

          ctx.fillStyle = '#1E634C';
          ctx.font = '900 34px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('吏湲??묒냽?섍린 ?몛 uldaemo.app', 0, 12);
          ctx.restore();
        }

        ctx.restore();
      }

      // ?꾨줈洹몃젅??諛?      ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.fillRect(0, 0, W, 8);
      ctx.fillStyle = '#10B981';
      ctx.fillRect(0, 0, W * progress, 8);

      ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
      ctx.font = '700 20px sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText('?몃?紐?怨듭떇 愿묎퀬 쨌 15s', W - 30, 45);
    }

    function drawRoundedRect(c, x, y, width, height, radius) {
      c.beginPath();
      c.moveTo(x + radius, y);
      c.lineTo(x + width - radius, y);
      c.quadraticCurveTo(x + width, y, x + width, y + radius);
      c.lineTo(x + width, y + height - radius);
      c.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      c.lineTo(x + radius, y + height);
      c.quadraticCurveTo(x, y + height, x, y + height - radius);
      c.lineTo(x, y + radius);
      c.quadraticCurveTo(x, y, x + radius, y);
      c.closePath();
    }

    function animate(timestamp) {
      if (!lastTimestamp) lastTimestamp = timestamp;
      const delta = (timestamp - lastTimestamp) / 1000;
      lastTimestamp = timestamp;

      if (isPlaying) {
        currentTime += delta;
        if (currentTime >= DURATION) {
          currentTime = 0;
        }
        checkAudioBeats(currentTime);
      }

      renderFrame(currentTime);
      updateUI();
      requestAnimationFrame(animate);
    }

    function updateUI() {
      const sec = Math.floor(currentTime);
      const ms = Math.floor((currentTime % 1) * 10);
      document.getElementById('timeDisplay').innerText = `00:${String(sec).padStart(2, '0')}.${ms}`;

      let scene = '??1/4 (怨듦컯쨌?숈떇)';
      if (currentTime >= 3.8 && currentTime < 7.5) scene = '??2/4 (?덉떖蹂댄샇)';
      else if (currentTime >= 7.5 && currentTime < 11.2) scene = '??3/4 (?ㅼ떆媛꾨쾲媛?';
      else if (currentTime >= 11.2) scene = '??4/4 (蹂댁긽쨌?붾뵫)';
      document.getElementById('sceneBadge').innerText = scene;
    }

    document.getElementById('btnPlayPause').addEventListener('click', () => {
      initAudio();
      isPlaying = !isPlaying;
      document.getElementById('playIcon').innerText = isPlaying ? '?몌툘' : '?띰툘';
      document.getElementById('playText').innerText = isPlaying ? '?쇱떆?뺤?' : '?ъ깮';
    });

    document.getElementById('btnReplay').addEventListener('click', () => {
      initAudio();
      currentTime = 0;
      isPlaying = true;
      document.getElementById('playIcon').innerText = '?몌툘';
      document.getElementById('playText').innerText = '?쇱떆?뺤?';
    });

    document.getElementById('btnAudio').addEventListener('click', () => {
      initAudio();
      audioEnabled = !audioEnabled;
      document.getElementById('btnAudio').innerText = audioEnabled ? '?뵄 BGM 耳쒖쭚' : '?뵁 ?뚯냼嫄?;
    });

    document.getElementById('btnExport').addEventListener('click', async () => {
      initAudio();
      const exportBtn = document.getElementById('btnExport');
      exportBtn.disabled = true;
      exportBtn.innerText = '??15珥??뱁솕 吏꾪뻾 以?..';

      currentTime = 0;
      isPlaying = true;

      const stream = canvas.captureStream(60);
      const recorder = new MediaRecorder(stream, {
        mimeType: MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
          ? 'video/webm;codecs=vp9'
          : 'video/webm'
      });

      const chunks = [];
      recorder.ondataavailable = e => {
        if (e.data.size > 0) chunks.push(e.data);
      };

      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `uldaemo_motion_15s_${Date.now()}.webm`;
        a.click();
        URL.revokeObjectURL(url);
        exportBtn.disabled = false;
        exportBtn.innerText = '?뱿 ?곸긽 ?뚯씪 ?ㅼ슫濡쒕뱶 (.webm)';
        alert('?럦 15珥?紐⑥뀡洹몃옒???곸긽 ?뚯씪(.webm)???깃났?곸쑝濡??ㅼ슫濡쒕뱶?섏뿀?듬땲??');
      };

      recorder.start();

      setTimeout(() => {
        if (recorder.state === 'recording') {
          recorder.stop();
        }
      }, DURATION * 1000 + 300);
    });

    window.addEventListener('click', initAudio, { once: true });
    requestAnimationFrame(animate);
  </script>
</body>
</html>
