<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>울대모 - 18초 공식 모션그래픽 브랜드 광고</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }
    body {
      background: #11161B;
      color: #FFFFFF;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 14px 32px;
    }
    .top-bar {
      text-align: center;
      margin-bottom: 14px;
    }
    .top-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(40, 125, 98, 0.22);
      border: 1px solid rgba(40, 125, 98, 0.55);
      color: #7CE8C3;
      font-size: 11.5px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 8px;
    }
    .top-bar h1 {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #FFFFFF;
    }
    .top-bar p {
      font-size: 13px;
      color: #94A3B8;
      margin-top: 4px;
    }

    /* 9:16 모바일 릴스/쇼츠 고해상도 플레이어 (실제 캔버스는 1080x1920 렌더링) */
    .stage-wrap {
      position: relative;
      width: 360px;
      height: 640px;
      border-radius: 28px;
      overflow: hidden;
      background: #F7F9F8;
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.65), 0 0 0 1.5px rgba(255, 255, 255, 0.14);
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: pointer;
    }

    /* 상단 진행 바 (인스타 스토리/릴스 스타일) */
    .story-progress {
      position: absolute;
      top: 12px;
      left: 14px;
      right: 14px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
      z-index: 10;
      pointer-events: none;
    }
    .story-seg {
      height: 3.5px;
      background: rgba(25, 31, 40, 0.14);
      border-radius: 999px;
      overflow: hidden;
    }
    .story-seg-fill {
      height: 100%;
      width: 0%;
      background: #287D62;
      border-radius: 999px;
      transition: width 0.06s linear;
    }

    /* 씬 점프 탭 */
    .scene-tabs {
      margin-top: 14px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 560px;
    }
    .scene-tab {
      background: #1E2630;
      color: #CBD5E1;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .scene-tab:hover {
      border-color: #287D62;
      color: #FFFFFF;
    }
    .scene-tab.active {
      background: #287D62;
      color: #FFFFFF;
      border-color: #287D62;
    }

    /* 컨트롤러 바 */
    .controls {
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: #1A212B;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 14px;
      border-radius: 999px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .ctrl-btn {
      background: #287D62;
      color: #FFFFFF;
      border: none;
      border-radius: 999px;
      padding: 8px 15px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      font-family: inherit;
    }
    .ctrl-btn:hover {
      background: #1E634C;
    }
    .ctrl-btn.secondary {
      background: #26303D;
      color: #E2E8F0;
    }
    .ctrl-btn.secondary:hover {
      background: #323F50;
    }
    .ctrl-btn.record {
      background: #191F28;
      border: 1px solid #287D62;
      color: #7CE8C3;
    }
    .ctrl-btn.record.recording {
      background: #DC2626;
      border-color: #DC2626;
      color: #FFFFFF;
    }
    .time-label {
      font-size: 12px;
      font-weight: 700;
      color: #94A3B8;
      min-width: 78px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="top-badge">9:16 릴스 · 쇼츠 · 캠퍼스 홍보용 모션그래픽</div>
    <h1>울대모 공식 브랜드 광고 (18초)</h1>
    <p>타사 비교 없이 오직 '울대모만의 4대 핵심 강점'을 담은 모던 4색 에디토리얼 모션그래픽</p>
  </div>

  <div class="stage-wrap" id="stageWrap">
    <div class="story-progress">
      <div class="story-seg"><div class="story-seg-fill" id="seg0"></div></div>
      <div class="story-seg"><div class="story-seg-fill" id="seg1"></div></div>
      <div class="story-seg"><div class="story-seg-fill" id="seg2"></div></div>
      <div class="story-seg"><div class="story-seg-fill" id="seg3"></div></div>
      <div class="story-seg"><div class="story-seg-fill" id="seg4"></div></div>
    </div>
    <canvas id="adCanvas" width="1080" height="1920" title="클릭하여 재생 / 일시정지"></canvas>
  </div>

  <div class="scene-tabs">
    <button class="scene-tab active" id="tab0" onclick="jumpToScene(0)">1. 공강 공감 Hook</button>
    <button class="scene-tab" id="tab1" onclick="jumpToScene(1)">2. 학식 & 호관 지도</button>
    <button class="scene-tab" id="tab2" onclick="jumpToScene(2)">3. 성향 & 인증뱃지</button>
    <button class="scene-tab" id="tab3" onclick="jumpToScene(3)">4. 원터치 DM & 리워드</button>
    <button class="scene-tab" id="tab4" onclick="jumpToScene(4)">5. 슬로건 & 시작하기</button>
  </div>

  <div class="controls">
    <button class="ctrl-btn" id="playBtn" onclick="togglePlay()">⏸ 일시정지</button>
    <button class="ctrl-btn secondary" onclick="restartAd()">↺ 처음부터</button>
    <span class="time-label" id="timeLabel">0.0s / 18.0s</span>
    <button class="ctrl-btn secondary" id="soundBtn" onclick="toggleSound()">🔊 효과음 켜짐</button>
    <button class="ctrl-btn record" id="recordBtn" onclick="exportVideoWebM()">🎥 영상 파일(.webm) 저장</button>
    <button class="ctrl-btn secondary" onclick="location.href='/'">앱으로 돌아가기 →</button>
  </div>

  <script>
    const canvas = document.getElementById("adCanvas");
    const ctx = canvas.getContext("2d");
    const W = 1080;
    const H = 1920;
    const TOTAL_DURATION = 18.0; // 18초 구성

    // 5개 씬 타임라인 정의
    const SCENES = [
      { start: 0.0, end: 3.2, title: "1. 공강 공감 Hook" },
      { start: 3.2, end: 7.0, title: "2. 학식 & 호관 지도" },
      { start: 7.0, end: 11.2, title: "3. 성향 & 인증뱃지" },
      { start: 11.2, end: 15.0, title: "4. 원터치 DM & 리워드" },
      { start: 15.0, end: 18.0, title: "5. 슬로건 & 시작하기" }
    ];

    // 4-Color Non-AI Modern Editorial Palette
    const C = {
      primary: "#287D62",
      primaryDark: "#1E634C",
      mint: "#EEF8F3",
      mintBorder: "#C5E6D6",
      bg: "#F7F9F8",
      white: "#FFFFFF",
      charcoal: "#191F28",
      gray: "#6B7684",
      border: "#E5EAE7"
    };

    let isPlaying = true;
    let currentTime = 0;
    let lastFrameTs = performance.now();
    let soundOn = true;
    let lastCueKey = "";
    let audioCtx = null;

    // 경쾌한 모션그래픽 사운드 합성기 (외부 MP3 파일 없이 Web Audio API로 작동)
    function playTone(freq, dur = 0.09, type = "sine", vol = 0.06, slideTo = null) {
      if (!soundOn) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        if (slideTo) {
          osc.frequency.exponentialRampToValueAtTime(slideTo, audioCtx.currentTime + dur);
        }
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    function triggerSceneAudioCues(t) {
      const cues = [
        { time: 0.15, key: "s1_open", fn: () => playTone(523.25, 0.12, "triangle", 0.06, 659.25) },
        { time: 1.1, key: "s1_chip", fn: () => playTone(783.99, 0.08, "sine", 0.05) },
        { time: 3.25, key: "s2_open", fn: () => playTone(587.33, 0.12, "triangle", 0.06, 783.99) },
        { time: 4.3, key: "s2_pin1", fn: () => playTone(880, 0.07, "sine", 0.05, 1046.5) },
        { time: 4.8, key: "s2_pin2", fn: () => playTone(987.77, 0.07, "sine", 0.05, 1174.66) },
        { time: 7.05, key: "s3_open", fn: () => playTone(523.25, 0.14, "triangle", 0.06, 783.99) },
        { time: 8.6, key: "s3_badge", fn: () => playTone(1046.5, 0.12, "sine", 0.06, 1318.5) },
        { time: 11.25, key: "s4_open", fn: () => playTone(659.25, 0.11, "triangle", 0.06, 880) },
        { time: 12.6, key: "s4_msg", fn: () => playTone(987.77, 0.08, "sine", 0.05, 1318.5) },
        { time: 13.5, key: "s4_heart", fn: () => playTone(1174.66, 0.1, "sine", 0.06, 1567.98) },
        { time: 15.05, key: "s5_end", fn: () => {
          playTone(523.25, 0.18, "triangle", 0.06, 659.25);
          setTimeout(() => playTone(783.99, 0.25, "sine", 0.06, 1046.5), 110);
        }}
      ];
      for (const c of cues) {
        if (Math.abs(t - c.time) < 0.08 && lastCueKey !== c.key) {
          lastCueKey = c.key;
          c.fn();
        }
      }
    }

    // 이징 헬퍼 함수
    function clamp(v, min = 0, max = 1) { return Math.max(min, Math.min(max, v)); }
    function prog(t, start, dur) { return clamp((t - start) / dur, 0, 1); }
    function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }
    function easeOutBack(x) {
      const c1 = 1.70158;
      const c3 = c1 + 1;
      return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
    }

    // 캔버스 도형 헬퍼
    function roundRect(x, y, w, h, r, fill, stroke, lineWidth = 2) {
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, r);
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lineWidth; ctx.stroke(); }
    }

    function drawShadowCard(x, y, w, h, r, fill = C.white, border = C.border, shadowAlpha = 0.06) {
      ctx.save();
      ctx.shadowColor = `rgba(25, 31, 40, ${shadowAlpha})`;
      ctx.shadowBlur = 36;
      ctx.shadowOffsetY = 14;
      roundRect(x, y, w, h, r, fill, null);
      ctx.restore();
      if (border) roundRect(x, y, w, h, r, null, border, 2.5);
    }

    function drawPill(cx, cy, text, bg, fg, border = null, fontSize = 28, padX = 28, padY = 16) {
      ctx.save();
      ctx.font = `700 ${fontSize}px Pretendard, sans-serif`;
      const tw = ctx.measureText(text).width;
      const w = tw + padX * 2;
      const h = fontSize + padY * 2;
      const x = cx - w / 2;
      const y = cy - h / 2;
      roundRect(x, y, w, h, h / 2, bg, border, 2);
      ctx.fillStyle = fg;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text, cx, cy + 1);
      ctx.restore();
      return { w, h };
    }

    function drawLogo(cx, cy, size = 120) {
      const x = cx - size / 2;
      const y = cy - size / 2;
      roundRect(x, y, size, size, size * 0.3, C.primary, null);
      ctx.fillStyle = "#DDF2E7";
      ctx.beginPath();
      ctx.arc(x + size * 0.36, y + size * 0.36, size * 0.075, 0, Math.PI * 2);
      ctx.arc(x + size * 0.64, y + size * 0.36, size * 0.075, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#FFFFFF";
      ctx.lineWidth = size * 0.08;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(x + size * 0.3, y + size * 0.56);
      ctx.bezierCurveTo(
        x + size * 0.38, y + size * 0.72,
        x + size * 0.62, y + size * 0.72,
        x + size * 0.7, y + size * 0.56
      );
      ctx.stroke();
    }

    function drawShieldIcon(cx, cy, r = 22, color = C.primary) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.strokeStyle = color;
      ctx.lineWidth = 3.5;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.beginPath();
      ctx.moveTo(0, -r);
      ctx.lineTo(r * 0.85, -r * 0.62);
      ctx.lineTo(r * 0.85, r * 0.1);
      ctx.quadraticCurveTo(r * 0.85, r * 0.75, 0, r);
      ctx.quadraticCurveTo(-r * 0.85, r * 0.75, -r * 0.85, r * 0.1);
      ctx.lineTo(-r * 0.85, -r * 0.62);
      ctx.closePath();
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-r * 0.32, 0);
      ctx.lineTo(-r * 0.05, r * 0.28);
      ctx.lineTo(r * 0.38, -r * 0.22);
      ctx.stroke();
      ctx.restore();
    }

    // 공통 배경 + 상단 브랜드 헤더
    function drawBaseBackground(sceneIdx, subTag) {
      ctx.fillStyle = C.bg;
      ctx.fillRect(0, 0, W, H);

      // 은은한 소프트 민트 원형 장식
      ctx.save();
      const grad = ctx.createRadialGradient(W * 0.5, 260, 40, W * 0.5, 260, 620);
      grad.addColorStop(0, "rgba(238, 248, 243, 0.95)");
      grad.addColorStop(1, "rgba(247, 249, 248, 0)");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, 900);
      ctx.restore();

      // 상단 브랜드 미니 바
      ctx.save();
      drawLogo(110, 118, 56);
      ctx.fillStyle = C.primary;
      ctx.font = "800 34px Pretendard, sans-serif";
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.fillText("울대모", 152, 118);

      // 우측 상단 태그
      drawPill(W - 190, 118, subTag, C.mint, C.primary, C.mintBorder, 24, 24, 12);
      ctx.restore();
    }

    // =====================================================
    // SCENE 1 (0.0s ~ 3.2s): 캠퍼스 공강 공감 Hook
    // =====================================================
    function renderScene1(t) {
      drawBaseBackground(0, "울산대학교 캠퍼스 번개");

      const pTitle = easeOutCubic(prog(t, 0.05, 0.55));
      ctx.save();
      ctx.translate(0, (1 - pTitle) * 40);
      ctx.globalAlpha = pTitle;

      drawPill(W / 2, 270, "⏰ 12:30 · 갑자기 생긴 공강 2시간", C.mint, C.primary, C.mintBorder, 30, 34, 16);

      ctx.fillStyle = C.charcoal;
      ctx.font = "800 72px Pretendard, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("오늘 공강 2시간,", W / 2, 410);
      ctx.fillStyle = C.primary;
      ctx.fillText("우리 학교 친구랑", W / 2, 505);
      ctx.fillStyle = C.charcoal;
      ctx.fillText("가볍게 모여볼까?", W / 2, 600);
      ctx.restore();

      // 중앙 메인 시간표 & 번개 제안 카드
      const pCard = easeOutBack(prog(t, 0.45, 0.6));
      ctx.save();
      ctx.translate(W / 2, 1050);
      ctx.scale(0.86 + 0.14 * pCard, 0.86 + 0.14 * pCard);
      ctx.globalAlpha = clamp(prog(t, 0.45, 0.35));

      drawShadowCard(-440, -290, 880, 580, 40, C.white, C.border, 0.08);

      // 카드 상단 헤더
      roundRect(-390, -240, 230, 52, 26, C.mint, null);
      ctx.fillStyle = C.primary;
      ctx.font = "800 25px Pretendard, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("오늘, 같이 할래요?", -275, -214);

      ctx.fillStyle = C.gray;
      ctx.font = "600 25px Pretendard, sans-serif";
      ctx.textAlign = "right";
      ctx.fillText("울산대학교 재학생 전용", 390, -214);

      // 4개 인기 공강 카테고리 칩 그리드
      const cats = [
        { icon: "🍚", title: "학생회관 학식 밥약", desc: "혼밥 대신 기분 좋게 한 끼", col: -205, row: -80, delay: 0.75 },
        { icon: "☕", title: "아산도서관·무거동 카공", desc: "이어폰 끼고 집중할 메이트", col: 205, row: -80, delay: 0.9 },
        { icon: "🏃", title: "아산스포츠센터 운동", desc: "배드민턴·러닝·헬스 메이트", col: -205, row: 125, delay: 1.05 },
        { icon: "🚕", title: "울산역·태화강 카풀", desc: "택시비 반값으로 아끼기", col: 205, row: 125, delay: 1.2 }
      ];

      cats.forEach(c => {
        const cp = easeOutBack(prog(t, c.delay, 0.45));
        ctx.save();
        ctx.translate(c.col, c.row);
        ctx.scale(0.8 + 0.2 * cp, 0.8 + 0.2 * cp);
        ctx.globalAlpha = clamp(prog(t, c.delay, 0.25));
        roundRect(-185, -78, 370, 156, 26, C.bg, C.border, 2);
        ctx.font = "44px sans-serif";
        ctx.textAlign = "left";
        ctx.textBaseline = "middle";
        ctx.fillText(c.icon, -155, -18);
        ctx.fillStyle = C.charcoal;
        ctx.font = "800 27px Pretendard, sans-serif";
        ctx.fillText(c.title, -92, -20);
        ctx.fillStyle = C.gray;
        ctx.font = "600 22px Pretendard, sans-serif";
        ctx.fillText(c.desc, -155, 36);
        ctx.restore();
      });

      ctx.restore();

      // 하단 안내 문구
      const pBot = easeOutCubic(prog(t, 1.4, 0.5));
      ctx.save();
      ctx.globalAlpha = pBot;
      drawPill(W / 2, 1540, "공강도 점심도, 우리 학교 학우와 안전하게", C.charcoal, C.white, null, 30, 44, 22);
      ctx.restore();
    }

    // =====================================================
    // SCENE 2 (3.2s ~ 7.0s): 강점 1 — 학식 메뉴 & 62개 호관 지도
    // =====================================================
    function renderScene2(localT) {
      drawBaseBackground(1, "강점 01 · 캠퍼스 밀착");

      const pHead = easeOutCubic(prog(localT, 0.05, 0.45));
      ctx.save();
      ctx.globalAlpha = pHead;
      ctx.translate(0, (1 - pHead) * 30);
      ctx.fillStyle = C.charcoal;
      ctx.font = "800 62px Pretendard, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("오늘 학식 메뉴부터 확인하고", W / 2, 290);
      ctx.fillStyle = C.primary;
      ctx.fillText("내 호관 바로 옆 번개를 콕!", W / 2, 375);
      ctx.restore();

      // 1) 상단 실시간 학식 카드
      const pCafe = easeOutBack(prog(localT, 0.3, 0.55));
      ctx.save();
      ctx.translate(W / 2, 595);
      ctx.scale(0.9 + 0.1 * pCafe, 0.9 + 0.1 * pCafe);
      ctx.globalAlpha = clamp(prog(localT, 0.3, 0.3));
      drawShadowCard(-450, -145, 900, 290, 32, C.white, C.mintBorder, 0.07);

      roundRect(-410, -108, 170, 44, 14, C.mint, null);
      ctx.fillStyle = C.primary;
      ctx.font = "800 23px Pretendard, sans-serif";

    // 상단 인스타 릴스형 진행바 및 탭 상태 업데이트
    function updateUiIndicators(t) {
      document.getElementById("timeLabel").textContent = `${t.toFixed(1)}s / ${TOTAL_DURATION.toFixed(1)}s`;
      SCENES.forEach((s, idx) => {
        const segEl = document.getElementById(`seg${idx}`);
        const tabEl = document.getElementById(`tab${idx}`);
        let pct = 0;
        if (t >= s.end) pct = 100;
        else if (t > s.start) pct = ((t - s.start) / (s.end - s.start)) * 100;
        if (segEl) segEl.style.width = `${pct}%`;
        if (tabEl) {
          const isCurrent = t >= s.start && (t < s.end || (idx === SCENES.length - 1 && t <= TOTAL_DURATION));
          tabEl.classList.toggle("active", isCurrent);
        }
      });
    }

    function renderFrame(t) {
      triggerSceneAudioCues(t);
      updateUiIndicators(t);

      if (t < SCENES[0].end) {
        renderScene1(t - SCENES[0].start);
      } else if (t < SCENES[1].end) {
        renderScene2(t - SCENES[1].start);
      } else if (t < SCENES[2].end) {
        renderScene3(t - SCENES[2].start);
      } else if (t < SCENES[3].end) {
        renderScene4(t - SCENES[3].start);
      } else {
        renderScene5(t - SCENES[4].start);
      }
    }

    function loop(now) {
      const dt = (now - lastFrameTs) / 1000;
      lastFrameTs = now;
      if (isPlaying) {
        currentTime += dt;
        if (currentTime > TOTAL_DURATION) {
          currentTime = 0;
          lastCueKey = "";
        }
      }
      renderFrame(currentTime);
      requestAnimationFrame(loop);
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      document.getElementById("playBtn").textContent = isPlaying ? "⏸ 일시정지" : "▶ 재생";
    }

    function restartAd() {
      currentTime = 0;
      lastCueKey = "";
      isPlaying = true;
      document.getElementById("playBtn").textContent = "⏸ 일시정지";
    }

    function jumpToScene(idx) {
      if (!SCENES[idx]) return;
      currentTime = SCENES[idx].start + 0.01;
      lastCueKey = "";
      isPlaying = true;
      document.getElementById("playBtn").textContent = "⏸ 일시정지";
    }

    function toggleSound() {
      soundOn = !soundOn;
      document.getElementById("soundBtn").textContent = soundOn ? "🔊 효과음 켜짐" : "🔇 효과음 꺼짐";
    }

    canvas.addEventListener("click", togglePlay);

    // 🎥 캔버스 모션그래픽을 고화질 WebM 동영상 파일로 즉시 녹화·추출
    let isRecording = false;
    function exportVideoWebM() {
      if (isRecording) return;
      if (!canvas.captureStream || typeof MediaRecorder === "undefined") {
        alert("현재 브라우저에서는 직접 영상 추출을 지원하지 않습니다. 화면 녹화(Win+G)를 이용해 주세요.");
        return;
      }
      isRecording = true;
      const btn = document.getElementById("recordBtn");
      btn.classList.add("recording");
      btn.textContent = "🔴 18초 녹화 중... (잠시만 기다려주세요)";

      currentTime = 0;
      lastCueKey = "";
      isPlaying = true;
      document.getElementById("playBtn").textContent = "⏸ 일시정지";

      const stream = canvas.captureStream(60);
      const chunks = [];
      let mime = "video/webm;codecs=vp9";
      if (!MediaRecorder.isTypeSupported(mime)) mime = "video/webm";
      const recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8000000 });

      recorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) chunks.push(e.data);
      };
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: "video/webm" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "uldaemo_official_promo_18s.webm";
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
        isRecording = false;
        btn.classList.remove("recording");
        btn.textContent = "✅ 영상 저장 완료! (다시 저장)";
      };

      recorder.start();
      setTimeout(() => {
        if (recorder.state === "recording") recorder.stop();
      }, TOTAL_DURATION * 1000 + 150);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
