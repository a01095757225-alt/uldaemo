    let _searchDebounceTimer = null;
    function resetHomeFilters() {
      state.search_q = "";
      state.home_cat = "전체";
      state.home_time_filter = "전체";
      state.home_visible_cnt = 8;
      render();
    }
    function handleHomeSearchInput(val) {
      state.search_q = val;
      state.home_visible_cnt = 8;
      clearTimeout(_searchDebounceTimer);
      _searchDebounceTimer = setTimeout(() => {
        const wrap = document.getElementById("home-feed-list-wrap");
        if (wrap) {
          wrap.innerHTML = renderHomeFeedListHtml();
        }
      }, 60);
    }

    function openCreateWithFoodSpot(spotId) {
      const spot = MUGEO_FOOD_SPOTS.find(s => s.id === spotId);
      if (!spot) return;
      state.prefill_title = spot.defaultTitle;
      state.prefill_cat = spot.cat;
      state.prefill_loc = spot.locName;
      state.active_modal = "create";
      render();
    }

    function getSpotScoreByPlatform(spot, platform) {
      if (!spot) return 0;
      if (platform === "naver") return Number(spot.naverRating || spot.rating || 0);
      if (platform === "kakao") return Number(spot.kakaoRating || spot.rating || 0);
      if (platform === "google") return Number(spot.googleRating || spot.rating || 0);
      return Number(spot.rating || 0);
    }

    function getFilteredFoodSpots() {
      const minRating = Number(state.food_min_rating || 4.6);
      const platform = state.food_platform || "all";
      const zone = state.food_zone || "all";
      return MUGEO_FOOD_SPOTS.filter(s => {
        if (zone !== "all" && s.zone !== zone) return false;
        const score = getSpotScoreByPlatform(s, platform);
        return score + 1e-6 >= minRating;
      });
    }

    function openFoodMapModal(initialSpotId) {
      state.active_modal = "food_map";
      state.focus_food_spot_id = initialSpotId || null;
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function closeFoodMapModal() {
      state.active_modal = null;
      state.focus_food_spot_id = null;
      render();
    }

    function setFoodMapFilter(patch) {
      if (!patch || typeof patch !== "object") return;
      if (patch.min_rating !== undefined) {
        const clamped = Math.max(4.0, Math.min(4.8, Math.round(Number(patch.min_rating) * 10) / 10));
        state.food_min_rating = clamped;
      }
      if (patch.platform !== undefined) state.food_platform = patch.platform;
      if (patch.zone !== undefined) state.food_zone = patch.zone;

      const modalWrap = document.getElementById("food-map-modal-root");
      if (modalWrap && state.active_modal === "food_map") {
        modalWrap.outerHTML = renderFoodMapModal();
        initFullFoodMapModal();
      } else {
        render();
      }
    }

    function focusSpotOnFoodMap(spotId) {
      const spot = MUGEO_FOOD_SPOTS.find(s => s.id === spotId);
      if (!spot || !window._fullFoodMap) return;
      window._fullFoodMap.setView([spot.lat, spot.lng], 18, { animate: true });
      setTimeout(() => {
        if (window._fullFoodMarkers && window._fullFoodMarkers[spotId]) {
          window._fullFoodMarkers[spotId].openPopup();
        }
      }, 220);
      const mapEl = document.getElementById("full-food-map");
      if (mapEl) mapEl.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    // 1) 홈 화면: 당근 스타일 심플 미니 프리뷰 지도 (대표 맛집 3곳만 겹침 없이 표시 · 클릭 시 맛집지도 창 오픈)
    let _homeFoodMapRetry = 0;
    function initHomeMugeoMap() {
      const el = document.getElementById("home-mugeo-map");
      if (!el) return;
      if (typeof L === "undefined") {
        if (_homeFoodMapRetry < 20) {
          _homeFoodMapRetry++;
          setTimeout(initHomeMugeoMap, 250);
        }
        return;
      }
      _homeFoodMapRetry = 0;
      try {
        if (window._homeMugeoMap) {
          try { window._homeMugeoMap.remove(); } catch (e) {}
          window._homeMugeoMap = null;
        }
        const map = L.map("home-mugeo-map", {
          zoomControl: false,
          attributionControl: false,
          dragging: false,
          scrollWheelZoom: false,
          doubleClickZoom: false,
          touchZoom: false,
          boxZoom: false,
          keyboard: false
        }).setView([35.5421, 129.2602], 16);
        window._homeMugeoMap = map;

        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19 }).addTo(map);
        setTimeout(() => { try { if (window._homeMugeoMap === map) map.invalidateSize(false); } catch (e) {} }, 120);
        setTimeout(() => { try { if (window._homeMugeoMap === map) map.invalidateSize(false); } catch (e) {} }, 350);

        // 좌(미토식당) · 중(기린카페) · 우(가무댕댕) 간격이 넓어 절대 겹치지 않는 대표 맛집 3곳만 미니 프리뷰에 표시
        const previewSpots = [
          MUGEO_FOOD_SPOTS.find(s => s.id === "r12"), // 좌측: 미토식당
          MUGEO_FOOD_SPOTS.find(s => s.id === "r3"),  // 중앙: 기린카페
          MUGEO_FOOD_SPOTS.find(s => s.id === "r1")   // 우측: 가무댕댕
        ].filter(Boolean);

        previewSpots.forEach(s => {
          const icon = L.divIcon({
            className: "karrot-food-marker",
            html: `
              <div onclick="event.stopPropagation(); openFoodMapModal('${s.id}')" style="display:flex; flex-direction:column; align-items:center; transform:translate(-50%, -82%); cursor:pointer;">
                <div style="width:42px; height:42px; border-radius:50%; background:${s.bg}; border:3px solid #FFFFFF; box-shadow:0 3px 10px rgba(0,0,0,0.20); display:flex; align-items:center; justify-content:center; font-size:var(--fs-xl); position:relative;">
                  ${s.emoji}
                  <div style="position:absolute; bottom:-6px; left:50%; transform:translateX(-50%); width:0; height:0; border-left:5.5px solid transparent; border-right:5.5px solid transparent; border-top:7px solid #FFFFFF;"></div>
                </div>
                <div style="margin-top:5px; text-align:center; line-height:1.18; white-space:nowrap; text-shadow: -1.5px -1.5px 0 #fff, 1.5px -1.5px 0 #fff, -1.5px 1.5px 0 #fff, 1.5px 1.5px 0 #fff, 0 1px 4px rgba(255,255,255,0.95);">
                  <div style="font-size:var(--fs-xs); font-weight:800; color:#FF6F0F;">★ ${s.rating.toFixed(1)}</div>
                  <div style="font-size:var(--fs-xs); font-weight:800; color:var(--text-primary); letter-spacing:-0.2px;">${escHtml(s.name)}</div>
                </div>
              </div>
            `,
            iconSize: [0, 0]
          });
          L.marker([s.lat, s.lng], { icon, interactive: true }).addTo(map);
        });
      } catch (e) { console.error("initHomeMugeoMap err:", e); }
    }

    function renderMugeoFoodMapSection() {
      const spotCnt = (typeof getFilteredFoodSpots === "function" ? getFilteredFoodSpots().length : MUGEO_FOOD_SPOTS.length) || MUGEO_FOOD_SPOTS.length;
      return `
        <div id="home-mugeo-map-wrap" onclick="openFoodMapModal()" style="display:flex; align-items:center; justify-content:space-between; gap:12px; height:64px; padding:0 16px; border-radius:var(--radius-card); background:#EEF8F3; margin: 4px 0 14px; cursor:pointer;">
          <div style="display:flex; align-items:center; gap:12px; min-width:0; flex:1;">
            <div style="width:36px; height:36px; border-radius:var(--radius-card); background:#FFFFFF; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#287D62" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>
              </svg>
            </div>
            <div style="min-width:0;">
              <div style="font-size:var(--fs-lg); font-weight:800; color:var(--text-primary); line-height:1.25;">내 주변 맛집 ${spotCnt}곳</div>
              <div style="font-size:var(--fs-xs); color:var(--text-secondary); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">가무댕댕 ★4.8 · 기린카페 ★4.8</div>
            </div>
          </div>
          <span style="font-size:var(--fs-sm); font-weight:800; color:#287D62; flex-shrink:0;">지도 보기 ›</span>
        </div>
      `;
    }

    // 2) 전용 맛집 지도 모달 창 (미니 지도를 눌렀을 때 열리는 상세 인터랙티브 지도 + 필터 + 리스트)
    function initFullFoodMapModal() {
      const el = document.getElementById("full-food-map");
      if (!el || typeof L === "undefined") return;
      try {
        if (window._fullFoodMap) { window._fullFoodMap.remove(); window._fullFoodMap = null; }
        window._fullFoodMarkers = {};
        const platform = state.food_platform || "all";
        const zone = state.food_zone || "all";

        // 학교 주변(바보사거리 · 울과대 · 울산대 후문)으로 영역 엄격 제한
        const mugeoBounds = L.latLngBounds([35.5375, 129.2465], [35.5525, 129.2675]);
        const zoneViewMap = {
          all:  { center: [35.5427, 129.2602], zoom: 16 },
          basa: { center: [35.5429, 129.2606], zoom: 17 },
          uc:   { center: [35.5410, 129.2592], zoom: 16 },
          back: { center: [35.5452, 129.2608], zoom: 16 }
        };
        const viewCfg = zoneViewMap[zone] || zoneViewMap.all;

        const map = L.map("full-food-map", {
          zoomControl: true,
          attributionControl: false,
          scrollWheelZoom: true,
          minZoom: 15,
          maxZoom: 19,
          maxBounds: mugeoBounds,
          maxBoundsViscosity: 1.0
        }).setView(viewCfg.center, viewCfg.zoom);
        window._fullFoodMap = map;

        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19 }).addTo(map);

        const qualifiedSpots = getFilteredFoodSpots().slice().sort((a, b) => getSpotScoreByPlatform(b, platform) - getSpotScoreByPlatform(a, platform));

        const platBadgeMap = {
          all:    { prefix: "★", color: "#FF6F0F", border: "#E5EAE7" },
          naver:  { prefix: "N★", color: "#03C75A", border: "#BBF7D0" },
          kakao:  { prefix: "K★", color: "#D97706", border: "#FDE68A" },
          google: { prefix: "G★", color: "#2563EB", border: "#BFDBFE" }
        };
        const pBadge = platBadgeMap[platform] || platBadgeMap.all;
        const markerLayer = L.layerGroup().addTo(map);

        function renderSmartModalMarkers() {
          markerLayer.clearLayers();
          window._fullFoodMarkers = {};
          const curZoom = map.getZoom();
          const maxFullLabels = curZoom >= 18 ? 22 : (curZoom === 17 ? 12 : 7);
          const placedLabelPts = [];

          qualifiedSpots.forEach(s => {
            const dispScore = getSpotScoreByPlatform(s, platform);
            const pt = map.latLngToContainerPoint([s.lat, s.lng]);
            const collides = placedLabelPts.some(p => Math.abs(pt.x - p.x) < 86 && Math.abs(pt.y - p.y) < 30);
            const isFocused = (state.focus_food_spot_id === s.id);
            const showFullLabel = isFocused || (!collides && placedLabelPts.length < maxFullLabels);
            if (showFullLabel) placedLabelPts.push(pt);

            const queryEnc = encodeURIComponent(s.kakaoQuery || `울산 무거동 ${s.name}`);
            const naverUrl = `https://map.naver.com/p/search/${queryEnc}`;
            const kakaoUrl = `https://map.kakao.com/link/search/${queryEnc}`;
            const googleUrl = `https://www.google.com/maps/search/?api=1&query=${queryEnc}`;

            const markerHtml = showFullLabel ? `
              <div style="display:inline-flex; flex-direction:column; align-items:center; transform:translate(-50%, -100%); cursor:pointer;">
                <div style="display:inline-flex; align-items:center; gap:4px; padding:4px 8.5px; border-radius:var(--radius-chip); background:#FFFFFF; border:1.5px solid ${pBadge.border}; box-shadow:0 2px 8px rgba(0,0,0,0.16); white-space:nowrap;">
                  <span style="font-size:var(--fs-sm); line-height:1;">${s.emoji}</span>
                  <span style="font-size:var(--fs-xs); font-weight:800; color:var(--text-primary); letter-spacing:-0.2px;">${escHtml(s.name)}</span>
                  <span style="font-size:var(--fs-xs); font-weight:800; color:${pBadge.color};">${pBadge.prefix}${dispScore.toFixed(1)}</span>
                </div>
                <div style="width:0; height:0; border-left:4px solid transparent; border-right:4px solid transparent; border-top:5px solid #FFFFFF; filter:drop-shadow(0 1px 1px rgba(0,0,0,0.12));"></div>
              </div>
            ` : `
              <div title="${escHtml(s.name)} (${pBadge.prefix}${dispScore.toFixed(1)})" style="width:26px; height:26px; border-radius:50%; background:${s.bg}; border:2px solid #FFFFFF; box-shadow:0 2px 6px rgba(0,0,0,0.22); display:flex; align-items:center; justify-content:center; font-size:var(--fs-sm); transform:translate(-50%, -50%); cursor:pointer;">
                ${s.emoji}
              </div>
            `;

            const icon = L.divIcon({ className: "karrot-food-marker", html: markerHtml, iconSize: [0, 0] });
            const popupHtml = `
              <div style="min-width:215px; font-family:inherit; padding:2px;">
                <div style="display:flex; align-items:center; justify-content:space-between; gap:6px; margin-bottom:2px;">
                  <span style="font-size:var(--fs-md); font-weight:800; color:var(--text-primary);">${s.emoji} ${escHtml(s.name)}</span>
                  <span style="font-size:var(--fs-xs); font-weight:700; color:#287D62; background:#EEF8F3; padding:2px 6px; border-radius:6px;">${escHtml(s.zoneLabel || '학교주변')}</span>
                </div>
                <div style="font-size:var(--fs-xs); color:var(--text-secondary); margin-bottom:3px;">${escHtml(s.menu)}</div>
                ${s.address ? `<div style="font-size:var(--fs-xs); color:#4E5968; font-weight:600; margin-bottom:7px;">📍 ${escHtml(s.address)}</div>` : ''}
                <div style="display:flex; gap:4px; margin-bottom:8px; background:#F8FAFC; padding:5px 6px; border-radius:var(--radius-btn); border:1px solid #E5EAE7; font-size:var(--fs-xs); font-weight:700; justify-content:space-around;">
                  <span style="color:#03C75A;">N ★${Number(s.naverRating || s.rating).toFixed(1)}</span>
                  <span style="color:#D97706;">K ★${Number(s.kakaoRating || s.rating).toFixed(1)}</span>
                  <span style="color:#2563EB;">G ★${Number(s.googleRating || s.rating).toFixed(1)}</span>
                </div>
                <div style="display:flex; gap:4px; margin-bottom:6px;">
                  <a href="${naverUrl}" target="_blank" style="flex:1; text-align:center; padding:5px 0; border-radius:7px; background:#03C75A; color:#FFFFFF; font-size:var(--fs-xs); font-weight:800; text-decoration:none;">네이버</a>
                  <a href="${kakaoUrl}" target="_blank" style="flex:1; text-align:center; padding:5px 0; border-radius:7px; background:#FEE500; color:#191919; font-size:var(--fs-xs); font-weight:800; text-decoration:none;">카카오</a>
                  <a href="${googleUrl}" target="_blank" style="flex:1; text-align:center; padding:5px 0; border-radius:7px; background:#EFF6FF; color:#1D4ED8; border:1px solid #BFDBFE; font-size:var(--fs-xs); font-weight:800; text-decoration:none;">구글맵</a>
                </div>
                <button type="button" onclick="openCreateWithFoodSpot('${s.id}')" style="width:100%; padding:6px 0; border-radius:var(--radius-btn); border:none; background:#287D62; color:#FFFFFF; font-size:var(--fs-xs); font-weight:800; cursor:pointer;">⚡ 이 맛집으로 밥약·카공 올리기</button>
              </div>
            `;
            const mk = L.marker([s.lat, s.lng], { icon, zIndexOffset: showFullLabel ? 300 : 50 }).addTo(markerLayer).bindPopup(popupHtml);
            window._fullFoodMarkers[s.id] = mk;
          });
        }

        renderSmartModalMarkers();
        map.on("zoomend", renderSmartModalMarkers);

        if (state.focus_food_spot_id) {
          const targetSpot = MUGEO_FOOD_SPOTS.find(s => s.id === state.focus_food_spot_id);
          if (targetSpot) {
            map.setView([targetSpot.lat, targetSpot.lng], 17);
            setTimeout(() => {
              if (window._fullFoodMarkers && window._fullFoodMarkers[targetSpot.id]) {
                window._fullFoodMarkers[targetSpot.id].openPopup();
              }
            }, 150);
          }
        }
      } catch (e) { console.error("initFullFoodMapModal err:", e); }
    }

    function renderFoodMapModal() {
      const minRating = Number(state.food_min_rating || 4.6);
      const platform = state.food_platform || "all";
      const zone = state.food_zone || "all";
      const spots = getFilteredFoodSpots().slice().sort((a, b) => getSpotScoreByPlatform(b, platform) - getSpotScoreByPlatform(a, platform));
      const ratingSteps = [4.0, 4.1, 4.2, 4.3, 4.4, 4.5, 4.6, 4.7, 4.8];
      const zoneTabs = [
        { k: "all", label: "전체" },
        { k: "basa", label: "바보사거리" },
        { k: "uc", label: "울과대" },
        { k: "back", label: "울산대 후문" }
      ];

      const listHtml = `
        <div>
          <!-- 권역 칩 + 평점 조절 한 줄 -->
          <div style="display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; margin-bottom:12px;">
            <div class="h-scroll-row" style="display:flex; gap:6px; flex:1 1 100%;">
              ${zoneTabs.map(z => `
                <button type="button" onclick="setFoodMapFilter({ zone: '${z.k}' })" style="height:32px; padding:0 13px; border-radius:var(--radius-card); border:none; background:${zone === z.k ? '#287D62' : '#F7F9F8'}; color:${zone === z.k ? '#FFFFFF' : '#6B7684'}; font-size:var(--fs-sm); font-weight:700; cursor:pointer;">${z.label}</button>
              `).join("")}
            </div>
            <div style="display:inline-flex; align-items:center; gap:4px; background:#F7F9F8; padding:3px 6px; border-radius:var(--radius-btn);">
              <button type="button" onclick="setFoodMapFilter({ min_rating: ${(minRating - 0.1).toFixed(1)} })" style="width:24px; height:24px; border:none; border-radius:var(--radius-btn); background:#FFFFFF; color:var(--text-primary); font-weight:800; cursor:pointer;">−</button>
              <select onchange="setFoodMapFilter({ min_rating: parseFloat(this.value) })" style="border:none; background:transparent; font-size:var(--fs-xs); font-weight:800; color:#287D62; cursor:pointer; outline:none; padding:0 4px;">
                ${ratingSteps.map(r => `<option value="${r.toFixed(1)}" ${Math.abs(minRating - r) < 0.05 ? 'selected' : ''}>★ ${r.toFixed(1)}+</option>`).join("")}
              </select>
              <button type="button" onclick="setFoodMapFilter({ min_rating: ${(minRating + 0.1).toFixed(1)} })" style="width:24px; height:24px; border:none; border-radius:var(--radius-btn); background:#FFFFFF; color:var(--text-primary); font-weight:800; cursor:pointer;">+</button>
            </div>
          </div>

          <div style="font-size:var(--fs-sm); font-weight:700; color:var(--text-secondary); margin-bottom:10px;">추천 맛집 ${spots.length}곳</div>
          <div style="display:flex; flex-direction:column; gap:8px; max-height:${isPC() ? '440px' : 'none'}; overflow-y:${isPC() ? 'auto' : 'visible'};">
            ${spots.map(s => {
              const dispScore = getSpotScoreByPlatform(s, platform);
              const isFocus = state.focus_food_spot_id === s.id;
              return `
                <div onclick="focusSpotOnFoodMap('${s.id}')" style="display:flex; align-items:center; justify-content:space-between; gap:10px; padding:13px 14px; border-radius:var(--radius-card); background:${isFocus ? '#EEF8F3' : '#F7F9F8'}; border:${isFocus ? '1.5px solid #287D62' : '1.5px solid transparent'}; cursor:pointer; transition:all 0.14s;">
                  <div style="min-width:0; flex:1;">
                    <div style="display:flex; align-items:center; gap:6px;">
                      <span style="font-size:var(--fs-lg); font-weight:800; color:var(--text-primary); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escHtml(s.name)}</span>
                      <span style="font-size:var(--fs-sm); font-weight:800; color:#287D62;">★ ${dispScore.toFixed(1)}</span>
                    </div>
                    <div style="font-size:var(--fs-xs); color:var(--text-secondary); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escHtml(s.menu)} · ${escHtml(s.zoneLabel)}</div>
                  </div>
                  <button type="button" onclick="event.stopPropagation(); openCreateWithFoodSpot('${s.id}')" style="flex-shrink:0; height:32px; padding:0 13px; border-radius:var(--radius-card); border:none; background:${isFocus ? '#287D62' : '#FFFFFF'}; color:${isFocus ? '#FFFFFF' : '#287D62'}; font-size:var(--fs-xs); font-weight:700; cursor:pointer;">밥약 열기</button>
                </div>
              `;
            }).join("")}
          </div>
        </div>
      `;

      const mapHtml = `
        <div style="position:relative; border-radius:var(--radius-card); overflow:hidden; border:1px solid #E5E8EB;">
          <div id="full-food-map" style="width:100%; height:340px; background:#EEF8F3;"></div>
        </div>
      `;

      return `
        <div id="food-map-modal-root" style="max-width:980px;">
          <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px;">
            <div style="display:flex; align-items:center; gap:10px;">
              <button type="button" onclick="closeFoodMapModal()" style="width:36px; height:36px; border-radius:var(--radius-card); border:1px solid #E5E8EB; background:#FFFFFF; color:var(--text-primary); font-size:var(--fs-lg); font-weight:700; cursor:pointer; display:inline-flex; align-items:center; justify-content:center;">←</button>
              <h1 style="margin:0; font-size:var(--fs-xl); font-weight:800; color:var(--text-primary);">내 주변 맛집</h1>
            </div>
            <select onchange="setFoodMapFilter({ platform: this.value })" style="height:34px; padding:0 12px; border-radius:var(--radius-chip); border:1px solid #E5E8EB; background:#FFFFFF; font-size:var(--fs-xs); font-weight:700; color:var(--text-primary); cursor:pointer; outline:none;">

    const _applyingPostIds = new Set();
    async function applyToPost(postId) {
      const pid = Number(postId);
      if (_applyingPostIds.has(pid)) return;
      const post = DB.posts.find(p => Number(p.id) === pid);
      if (!post) return;
      _applyingPostIds.add(pid);
      // 0ms 즉각 낙관적 UI 반영 (서버 응답을 기다리지 않고 바로 신청 완료 UX 제공)
      const tempAppId = -Date.now();
      const prevApps = (DB.applications || []).slice();
      const existingPending = prevApps.find(a => Number(a.post_id) === pid && String(a.applicant_id) === String(state.user_id));
      if (!existingPending) {
        DB.applications = [...prevApps, { id: tempAppId, post_id: pid, applicant_id: state.user_id, status: "대기중", updated_at: Date.now() }];
      }
      try { if (navigator && typeof navigator.vibrate === "function") navigator.vibrate([20, 35, 30]); } catch (e) {}
      fireConfetti();
      showMeetupMatchCelebration(post, DB.users[state.user_id], "apply");
      showToast("참여를 신청했어요! 방장이 수락하면 대화방이 열려요");
      render();
      try {
        const res = await callApiAction("apply", { post_id: pid });
        if (!res.ok) {
          DB.applications = prevApps;
          render();
          return showToast(res.message || "참여 신청에 실패했어요.");
        }
        render();
      } finally {
        _applyingPostIds.delete(pid);
      }
    }

    function syncCreateTimeFromParts() {
      const ampmEl = document.getElementById("c_time_ampm");
      const hrEl = document.getElementById("c_time_hour");
      const minEl = document.getElementById("c_time_min");
      const hiddenEl = document.getElementById("c_time");
      if (!ampmEl || !hrEl || !minEl || !hiddenEl) return;
      let h = parseInt(hrEl.value, 10) || 12;
      const isPm = ampmEl.value === "PM";
      if (isPm && h < 12) h += 12;
      if (!isPm && h === 12) h = 0;
      const mm = String(minEl.value || "00").padStart(2, "0");
      hiddenEl.value = `${String(h).padStart(2, "0")}:${mm}`;
    }

    function setCreateTimeInputs(hhmm) {
      const parts = String(hhmm || "12:30").split(":");
      let h24 = parseInt(parts[0], 10);
      let m = parseInt(parts[1], 10);
      if (isNaN(h24)) h24 = 12;
      if (isNaN(m)) m = 30;
      const roundedMin = (Math.round(m / 10) * 10) % 60;
      if (m >= 55) h24 = (h24 + 1) % 24;
      const isPm = h24 >= 12;
      const h12 = (h24 % 12) || 12;
      const ampmEl = document.getElementById("c_time_ampm");
      const hrEl = document.getElementById("c_time_hour");
      const minEl = document.getElementById("c_time_min");
      const hiddenEl = document.getElementById("c_time");
      if (ampmEl) ampmEl.value = isPm ? "PM" : "AM";
      if (hrEl) hrEl.value = String(h12);
      if (minEl) minEl.value = String(roundedMin).padStart(2, "0");
      if (hiddenEl) hiddenEl.value = `${String(h24).padStart(2, "0")}:${String(roundedMin).padStart(2, "0")}`;
    }

        return;

      const curVal = (document.getElementById(kind === "loc" ? "c_loc" : "c_style")?.value || "").trim();
      listEl.innerHTML = filtered.map(item => {
        const active = item === curVal;

    function setCreateQuickTime(type) {
      const dateEl = document.getElementById("c_date");
      if (!dateEl) return;
      const now = new Date();
      let hhmm = "12:30";
      if (type === "now") {
        now.setMinutes(now.getMinutes() + 10);
        dateEl.value = getTodayStr();
        hhmm = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      } else if (type === "30min") {
        now.setMinutes(now.getMinutes() + 30);
        dateEl.value = getTodayStr();
        hhmm = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      } else if (type === "1hour") {
        now.setMinutes(now.getMinutes() + 60);
        dateEl.value = getTodayStr();
        hhmm = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      } else if (type === "dinner") {
        dateEl.value = getTodayStr();
        hhmm = "18:30";
      } else if (type === "tomorrow_lunch") {
        const tm = new Date();
        tm.setDate(tm.getDate() + 1);
        const y = tm.getFullYear();
        const m = String(tm.getMonth() + 1).padStart(2, '0');
        const d = String(tm.getDate()).padStart(2, '0');
        dateEl.value = `${y}-${m}-${d}`;
        hhmm = "12:30";
      }
      setCreateTimeInputs(hhmm);
      document.querySelectorAll(".time-quick-chip").forEach(c => c.classList.remove("active"));
      const target = document.getElementById(`time_chip_${type}`);
      if (target) target.classList.add("active");
    }

    let _creatingPost = false;
    async function submitCreatePost() {
      if (_creatingPost) return;
      syncCreateTimeFromParts();
      const title = document.getElementById("c_title").value.trim();
      const category = document.getElementById("c_cat").value.trim();
      const meet_date = document.getElementById("c_date").value;
      const meet_time = document.getElementById("c_time").value;
      const location = document.getElementById("c_loc").value.trim();
      const customMaxEl = document.getElementById("c_max_custom");
      const customRawStr = customMaxEl ? String(customMaxEl.value || "").trim() : "";
      let max_p;
      if (customRawStr !== "") {
        const rawCustomMax = parseInt(customRawStr, 10);
        if (isNaN(rawCustomMax) || rawCustomMax < 2 || rawCustomMax > 30) {
          return showToast("모집 인원은 2명 이상 30명 이하로 입력해주세요.");
        }
        max_p = rawCustomMax;
      } else {
        max_p = parseInt(document.getElementById("c_max").value || "3", 10);
      }
      if (isNaN(max_p) || max_p < 2 || max_p > 30) return showToast("모집 인원은 2명 이상 30명 이하로 설정해주세요.");
      const style = document.getElementById("c_style").value.trim();
      const is_official = (isCurrentUserAdmin() && document.getElementById("c_official")) ? document.getElementById("c_official").checked : false;

      if (title.length < 2) return showToast("모집 제목은 최소 2글자 이상 입력해주세요.");
      if (meet_date < getTodayStr()) return showToast("과거 날짜로는 번개 모임을 등록할 수 없어요.");
      if (meet_date === getTodayStr()) {
        const targetTs = new Date(`${meet_date}T${meet_time || "00:00"}:00`).getTime();
        if (!isNaN(targetTs) && targetTs <= Date.now()) {
          return showToast("현재 시각 이후로만 모임 시간을 설정할 수 있어요.");
        }
      }
      if (!category || !location || !style) return showToast("카테고리, 장소, 성향 태그를 모두 입력해주세요.");

      const myTier = getTierByTemp(resolveUserTempForTier(state.user_id));
      const meUser = DB.users[state.user_id];
      const extraCoupons = meUser ? Number(meUser.extra_post_coupons || 0) : 0;
      const todayCount = getTodayMyPostCount(state.user_id);
      if (!isCurrentUserAdmin() && todayCount >= (myTier.dailyLimit + extraCoupons)) {
        return showToast(`${myTier.name} 단계는 하루 ${myTier.dailyLimit}번까지 번개를 열 수 있어요. (광장 룰렛에서 추가 개설권을 얻을 수 있어요)`);
      }
      if (!isCurrentUserAdmin() && todayCount >= myTier.dailyLimit && meUser && extraCoupons > 0) {
        meUser.extra_post_coupons = Math.max(0, extraCoupons - 1);
      }
      let useBoost = false;
      const boostCheckbox = document.getElementById("c_use_boost");
      const wantBoost = Boolean(state.prefill_boost || (boostCheckbox && boostCheckbox.checked));
      if (wantBoost && meUser && Number(meUser.boost_coupons || 0) > 0) {
        meUser.boost_coupons = Math.max(0, Number(meUser.boost_coupons || 0) - 1);
        useBoost = true;
        state.prefill_boost = false;
      }

      _creatingPost = true;
      // 0ms 즉각 낙관적 UI 반영: 모달을 즉시 닫고 홈 피드 최상단에 번개 카드를 바로 표시
      const tempPostId = -Date.now();
      const prevPosts = (DB.posts || []).slice();
      const optimisticPost = {
        id: tempPostId,
        author_id: state.user_id,
        title,
        category,
        meet_date,
        meet_time,
        location,
        max_participants: max_p,
        accepted_count: 1,
        meeting_style: style,
        status: "모집중",
        is_official,
        is_boosted: useBoost,
        created_at: Date.now(),
        updated_at: Date.now()
      };
      DB.posts = [optimisticPost, ...prevPosts];
      window._justCreatedPostId = tempPostId;
      state.prefill_title = ""; state.prefill_loc = ""; state.prefill_date = ""; state.prefill_time = ""; state.invite_mate_id = null;
      state.active_modal = null;
      state.nav_tab = "홈";
      render();
      try { if (navigator && typeof navigator.vibrate === "function") navigator.vibrate([25, 40, 45]); } catch (e) {}
      triggerLightningFlash();
      fireConfetti({ mode: "match" });
      showMeetupMatchCelebration(optimisticPost, null, "create");
      showToast("⚡ 새 번개를 올렸어요!");
      try {
        const res = await callApiAction("create_post", {
          title,
          category,
          meet_date,
          meet_time,
          location,
          max_participants: max_p,
          meeting_style: style,
          is_official,
          use_boost: useBoost
        });
        if (!res || !res.ok) {
          DB.posts = prevPosts;
          render();
          return showToast((res && res.message) || "번개 등록에 실패했어요.");
        }
        window._justCreatedPostId = res.post_id || (DB.posts[0] && DB.posts[0].id);
        render();
      } finally {
        _creatingPost = false;
        setTimeout(() => { window._justCreatedPostId = null; }, 1200);
      }
    }

    function openDetailModal(postId) {
      state.selected_post_id = postId;
      state.active_modal = "detail";
      render();

    function initDetailMap() {
      const el = document.getElementById("detail-map");
      const post = DB.posts.find(p => p.id === state.selected_post_id);
      if (!el || !post) return;
      try {
        if (window._detailMap) { window._detailMap.remove(); window._detailMap = null; }
        const c = getBuildingCoords(post.location);
        const detailBounds = L.latLngBounds([35.5375, 129.2465], [35.5525, 129.2675]);
        const map = L.map("detail-map", { zoomControl: true, attributionControl: false, minZoom: 15, maxZoom: 19, maxBounds: detailBounds, maxBoundsViscosity: 1.0 }).setView([c[0], c[1]], 17);
        window._detailMap = map;
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19 }).addTo(map);
        L.circleMarker([c[0], c[1]], { radius: 11, color: "#FFFFFF", weight: 3, fillColor: "#287D62", fillOpacity: 0.95 })
          .addTo(map)
          .bindPopup(`<b>📍 ${escHtml(post.location)}</b><br>${escHtml(post.meet_date)} ${escHtml(post.meet_time)}`)
          .openPopup();
        if (state.gps_consent) {
          L.circleMarker([state.my_lat, state.my_lng], { radius: 7, color: "#FFFFFF", weight: 2, fillColor: "#2B7FFF", fillOpacity: 1 }).addTo(map);
        }
      } catch (e) {}
    }

    function getBroadCollege(dept) {
      if (!dept) return "울산대 재학생";
      if (/컴퓨터|IT|ICT|소프트웨어|AI|전기|전자|기계|화공|화학공|토목|신소재|건축|생명공|융합/i.test(dept)) return "공과대학";
      if (/경영|경제|글로벌/i.test(dept)) return "경영대학";
      if (/의|간호|약학/i.test(dept)) return "의과대학";
      if (/디자인|미술|음악|예술|체육|스포츠/i.test(dept)) return "예술체육대학";
      if (/국문|영문|인문|철학|역사|어문/i.test(dept)) return "인문대학";
      if (/자연|수학|물리|생명과학/i.test(dept)) return "자연과학대학";
      if (/사회/i.test(dept)) return "사회과학대학";
      return "울산대 재학생";
    }

        cancelText: "돌아가기",

        onConfirm: () => deletePost(postId)
      });
    }

    const _processingAppIds = new Set();
    async function acceptApplicant(appId) {
      const aid = Number(appId);
      if (_processingAppIds.has(aid)) return;
      const app = (DB.applications || []).find(a => Number(a.id) === aid);
      if (!app) return;
      const post = DB.posts.find(p => Number(p.id) === Number(app.post_id)) || null;
      const apUser = (DB.users[app.applicant_id] || { avatar: "🐱", nickname: "학우" });
      _processingAppIds.add(aid);
      const prevStatus = app.status;
      app.status = "승인됨";
      if (post) {
        state.active_chat_post_id = Number(post.id);
        state.chat_list_mode = false;
      }
      try { if (navigator && typeof navigator.vibrate === "function") navigator.vibrate([30, 45, 50]); } catch (e) {}
      triggerLightningFlash();
      fireConfetti({ mode: "match" });
      showMeetupMatchCelebration(post, apUser);
      showToast("🎉 신청을 수락했어요! 대화 탭에 안심 채팅방이 열렸어요.");
      render();
      try {
        const res = await callApiAction("accept", { app_id: aid });
        if (!res.ok) {
          app.status = prevStatus;
          render();
          return showToast(res.message || "신청 수락에 실패했어요.");
        }
        render();
      } finally {
        _processingAppIds.delete(aid);
      }
    }

    async function rejectApplicant(appId) {
      const aid = Number(appId);
      if (_processingAppIds.has(aid)) return;
      const app = (DB.applications || []).find(a => Number(a.id) === aid);
      if (!app) return;
      _processingAppIds.add(aid);
      const prevStatus = app.status;
      app.status = "거절됨";
      showToast("신청을 거절했어요.");
      render();
      try {
        const res = await callApiAction("reject", { app_id: aid });
        if (!res.ok) {
          app.status = prevStatus;
          render();
          return showToast(res.message || "신청 거절에 실패했어요.");
        }
        render();
      } finally {
        _processingAppIds.delete(aid);
      }
    }

    async function closePostEarly(postId) {
      const res = await callApiAction("close_post", { post_id: Number(postId) });
      if (!res.ok) return showToast(res.message || "마감 처리에 실패했어요.");
      showToast("모집이 마감 처리되었어요.");
      render();
    }

    // =========================================================
    // 6-B. 🔥 캠퍼스 광장 탭 (오늘의 울대 밸런스 게임 & 24시간 한줄 잔디톡)
    // =========================================================
    async function voteBalancePoll(pollId, side) {
      ensurePlazaDefaults(DB);
      const poll = DB.polls.find(p => Number(p.id) === Number(pollId));
      if (!poll) return;
      const uid = state.user_id;
      const wasVoted = (poll.votes_a || []).includes(uid) || (poll.votes_b || []).includes(uid);
      poll.votes_a = (poll.votes_a || []).filter(u => u !== uid);
      poll.votes_b = (poll.votes_b || []).filter(u => u !== uid);
      if (side === "A") poll.votes_a.push(uid);
      else poll.votes_b.push(uid);

      // 첫 투표 보너스: 활동 리워드 점수 +2점 (매너온도는 실제 대면 만남 평가로만 변동)
      const me = DB.users[uid];
      if (me && !wasVoted && !window["_voted_" + pollId]) {
        window["_voted_" + pollId] = true;
        me.bonus_score = (me.bonus_score || 0) + 2;
        showToast("투표 완료! 캠퍼스 소통 참여로 활동 리워드 점수 +2점 획득!");
      } else {
        showToast("투표가 반영되었어요!");
      }
      saveDB(false);
      render();
      if (getSessionToken()) {
        await callApiAction("plaza_vote", {
          poll_id: poll.id,
          side,
          poll_meta: {
            id: poll.id,
            tag: poll.tag || "",
            question: poll.question || "",
            opt_a: poll.opt_a || "",
            opt_b: poll.opt_b || ""
          }
        });
        ensurePlazaDefaults(DB);
        render();
      }
    }

    async function createNewBalancePoll() {
      const qEl = document.getElementById("plaza_poll_q");
      const aEl = document.getElementById("plaza_poll_a");
      const bEl = document.getElementById("plaza_poll_b");
      const tagEl = document.getElementById("plaza_poll_tag");
      const q = qEl ? qEl.value.trim() : "";
      const a = aEl ? aEl.value.trim() : "";
      const b = bEl ? bEl.value.trim() : "";
      const tag = tagEl ? tagEl.value : "💘 연애 레전드";
      if (q.length < 3 || !a || !b) {
        return showToast("질문과 A, B 선택지를 모두 입력해주세요!");
      }
      const formattedQ = q.startsWith("⚖️") ? q : `⚖️ ${q}`;
      if (getSessionToken()) {
        const res = await callApiAction("plaza_create_poll", {
          tag,
          question: formattedQ,
          opt_a: a,
          opt_b: b
        });
        if (!res.ok) return showToast(res.message || "투표 등록에 실패했어요.");
        ensurePlazaDefaults(DB);
        state.show_poll_form = false;
        state.polls_show_all = true;
        showToast("⚖️ 새 밸런스 게임이 등록되었어요!");
        render();
        return;
      }
      ensurePlazaDefaults(DB);
      DB.polls.unshift({
        id: Date.now(),
        tag,
        question: formattedQ,
        opt_a: a,
        opt_b: b,
        votes_a: [state.user_id],
        votes_b: []
      });
      state.show_poll_form = false;
      state.polls_show_all = true;
      saveDB(false);
      showToast("⚖️ 새 밸런스 게임이 등록되었어요!");
      render();
    }

    function drawRandomViralPoll() {
      ensurePlazaDefaults(DB);
      const existingQs = new Set((DB.polls || []).map(p => p.question));
      const candidates = VIRAL_BALANCE_POOL.filter(item => !existingQs.has(item.question));
      if (candidates.length === 0) {
        return showToast("🎉 준비된 네이버·SNS 인기 레전드 밸런스 질문이 모두 광장에 올라와 있습니다!");
      }
      const pick = candidates[Math.floor(Math.random() * candidates.length)];
      DB.polls.unshift({
        id: Date.now(),
        tag: pick.tag,
        question: pick.question,
        opt_a: pick.opt_a,
        opt_b: pick.opt_b,
        votes_a: [],
        votes_b: []
      });
      state.plaza_poll_cat = "전체";
      saveDB(true);
      showToast("🎲 새로운 밸런스 질문이 추가되었어요!");
      render();
    }

    async function submitPlazaTalk() {
      const txtEl = document.getElementById("plaza_talk_in");
      const catEl = document.getElementById("plaza_talk_cat");
      const text = txtEl ? txtEl.value.trim() : "";
      const category = catEl ? catEl.value : "🍚 밥약";
      if (text.length < 2) return showToast("한줄 잔디톡 내용을 2글자 이상 입력해주세요.");
      if (txtEl) txtEl.value = "";

      const now = new Date();
      const timeLabel = `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;
      ensurePlazaDefaults(DB);
      const tempId = -Date.now();
      DB.plaza_talks.unshift({
        id: tempId,
        author_id: state.user_id,
        text,
        category,
        created_at: timeLabel,
        created_ts: Date.now(),
        likes: [],
        replies: []
      });
      showToast("🌱 한줄 이야기가 등록되었어요!");
      render();
      const res = await callApiAction("plaza_create_talk", { text });
      if (!res.ok) {
        DB.plaza_talks = (DB.plaza_talks || []).filter(t => t.id !== tempId);
        render();
        return showToast(res.message || "한줄 이야기 등록에 실패했어요.");
      }
      render();
    }

    async function toggleTalkLike(talkId) {
      ensurePlazaDefaults(DB);
      const t = DB.plaza_talks.find(x => Number(x.id) === Number(talkId));
      if (!t || Number(t.id) < 0) return;
      t.likes = t.likes || [];
      const prevLikes = t.likes.slice();
      const idx = t.likes.indexOf(state.user_id);
      if (idx >= 0) t.likes.splice(idx, 1);
      else t.likes.push(state.user_id);
      render();
      const res = await callApiAction("plaza_like_talk", { talk_id: Number(talkId) });
      if (!res.ok) {
        t.likes = prevLikes;
        render();
      }
    }

    // ===== 익명 답글 (밸런스 게임 / 한줄 이야기 공용) =====
    function findReplyTarget(kind, id) {
      ensurePlazaDefaults(DB);
      const list = kind === "p" ? DB.polls : DB.plaza_talks;
      return (list || []).find(x => String(x.id) === String(id));
    }

    function getReplyCount(item) {
      return (item.replies || []).filter(r => r && !r.deleted).length;
    }

    function toggleReplies(kind, id) {
      state.open_replies = state.open_replies || {};
      const key = kind + id;
      state.open_replies[key] = !state.open_replies[key];
      render();
    }

    const _replySubmitting = new Set();
    async function submitReply(kind, id) {
      const key = `${kind}_${id}`;
      if (_replySubmitting.has(key)) return;
      const item = findReplyTarget(kind, id);
      if (!item) return;
      const el = document.getElementById("reply_in_" + kind + id);
      const text = el ? el.value.trim() : "";
      if (text.length < 1) return showToast("답글 내용을 입력해주세요.");
      if (text.length > 200) return showToast("답글은 200자 이내로 입력해주세요.");
      if (el) el.value = "";
      _replySubmitting.add(key);
      const subTarget = (state.reply_target && state.reply_target.kind === kind && Number(state.reply_target.targetId) === Number(id))
        ? state.reply_target
        : null;
      const parentId = subTarget ? Number(subTarget.parentId) : null;
      if (subTarget) state.reply_target = null;
      item.replies = item.replies || [];
      const tempRid = -Date.now();
      const now = new Date();
      const newLocalReply = {
        id: tempRid,
        author_id: state.user_id,
        text,
        created_at: `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`,
        deleted: false,
        likes: []
      };
      if (parentId) newLocalReply.parent_id = parentId;
      item.replies.push(newLocalReply);
      item.updated_at = Date.now();
      state.open_replies = state.open_replies || {};
      state.open_replies[kind + id] = true;
      render();
      try {
        const payload = { kind, target_id: Number(id), text };
        if (parentId) payload.parent_id = parentId;
        if (kind === "p") {
          payload.poll_meta = {
            id: item.id,
            tag: item.tag || "",
            question: item.question || "",
            opt_a: item.opt_a || "",
            opt_b: item.opt_b || ""
          };
        }
        const res = await callApiAction("plaza_reply", payload);
        if (!res.ok) {
          item.replies = (item.replies || []).filter(r => r.id !== tempRid);
          render();
          return showToast(res.message || "답글 등록에 실패했어요.");
        }
        ensurePlazaDefaults(DB);
        state.open_replies[kind + id] = true;
        showToast(parentId ? "대댓글이 등록되었어요." : "답글이 등록되었어요.");
        render();
      } finally {
        _replySubmitting.delete(key);
      }
    }

    function startSubReply(kind, targetId, parentReplyId, targetLabel) {
      state.open_replies = state.open_replies || {};
      state.open_replies[kind + targetId] = true;
      state.reply_target = { kind, targetId: Number(targetId), parentId: Number(parentReplyId), label: String(targetLabel || "익명") };
      render();
      setTimeout(() => {
        const inp = document.getElementById("reply_in_" + kind + targetId);
        if (inp) { inp.focus(); inp.scrollIntoView({ behavior: "smooth", block: "center" }); }
      }, 40);
    }

    function cancelSubReply() {
      state.reply_target = null;
      render();
    }

    async function toggleReplyLike(kind, targetId, replyId) {
      const item = findReplyTarget(kind, targetId);
      if (!item) return;
      const r = (item.replies || []).find(x => Number(x.id) === Number(replyId));
      if (!r || Number(r.id) < 0) return;
      r.likes = Array.isArray(r.likes) ? r.likes.map(String) : [];
      const myId = String(state.user_id || "");
      if (!myId) return;
      const prevLikes = r.likes.slice();
      const idx = r.likes.indexOf(myId);
      if (idx >= 0) r.likes.splice(idx, 1);
      else r.likes.push(myId);
      render();
      const res = await callApiAction("plaza_like_reply", {
        kind,
        target_id: Number(targetId),
        reply_id: Number(replyId)
      });
      if (!res.ok) {
        r.likes = prevLikes;
        render();
        return showToast(res.message || "좋아요 반영에 실패했어요.");
      }
      ensurePlazaDefaults(DB);
      render();
    }

    async function deleteReply(kind, id, rid) {
      const item = findReplyTarget(kind, id);
      if (!item) return;
      const r = (item.replies || []).find(x => Number(x.id) === Number(rid));
      if (!r || String(r.author_id) !== String(state.user_id)) return;
      r.deleted = true;
      item.updated_at = Date.now();
      render();
      const res = await callApiAction("plaza_delete_reply", {
        kind,
        target_id: Number(id),
        reply_id: Number(rid)
      });
      if (!res.ok) {
        r.deleted = false;
        render();
        return showToast(res.message || "답글 삭제에 실패했어요.");
      }
      ensurePlazaDefaults(DB);
      render();
    }

    function renderReplyButton(kind, item) {
      const n = getReplyCount(item);
      const open = !!(state.open_replies && state.open_replies[kind + item.id]);
      return `<button type="button" style="border:none; background:${open ? '#EEF8F3' : '#F2F4F3'}; color:${open ? '#287D62' : '#6B7684'}; font-size:var(--fs-xs); font-weight:600; padding:4px 9px; border-radius:var(--radius-chip); cursor:pointer; flex-shrink:0;" onclick="toggleReplies('${kind}', ${item.id})">💬 ${n}</button>`;
    }

    function renderReplyThread(kind, item) {
      if (!(state.open_replies && state.open_replies[kind + item.id])) return "";
      // 익명 번호: 이 글 안에서 처음 등장한 순서대로 고정 부여 (신상 비노출)
      const order = [];
      (item.replies || []).forEach(r => {
        if (r && r.author_id && r.author_id !== item.author_id && !order.includes(r.author_id)) order.push(r.author_id);
      });
      const label = (uid) => {
        if (item.author_id && uid === item.author_id) return "익명(글쓴이)";
        return "익명 " + (order.indexOf(uid) + 1);
      };
      const allReplies = (item.replies || []).filter(r => r && !isUserBlocked(r.author_id));

    function getAllCampusRouletteMenuPool() {
      const seen = new Set();
      const merged = [];
      const pushUnique = (item) => {
        const key = String(item.short || item.label || "").replace(/\s+/g, "").toLowerCase();
        if (!key || seen.has(key)) return;
        seen.add(key);
        merged.push(item);
      };

      // 1) 무거동 맛집 지도(MUGEO_FOOD_SPOTS) 22곳 실제 가게 자동 연동
      if (typeof MUGEO_FOOD_SPOTS !== "undefined" && Array.isArray(MUGEO_FOOD_SPOTS)) {
        MUGEO_FOOD_SPOTS.forEach(s => {
          const catStr = String(s.cat || "");
          const menuStr = String(s.menu || "");
          const nameStr = String(s.name || "");
          const isCafe = catStr.includes("카공") || nameStr.includes("카페") || nameStr.includes("커피");
          const isSoup = /국밥|라멘|칼국수|나베|해장|우동|찌개|쌀국수|탕/.test(nameStr + menuStr);
          const isGroup = catStr.includes("술") || /파스타|피자|치킨|구이|쭈꾸미|떡볶이|사시미/.test(nameStr + menuStr);
          const tags = ["all"];
          if (isCafe) {
            tags.push("cafe");
          } else {
            if (!isGroup || /국밥|라멘|돈까스|덮밥|칼국수|샌드위치|떡볶이|초밥/.test(nameStr + menuStr)) tags.push("solo");
            if (isGroup || !tags.includes("solo")) tags.push("group");
            if (isSoup) tags.push("soup");
          }
          const shortName = nameStr.replace(/\s*(울산대점|무거점|울대점)$/g, "").trim().slice(0, 7);
          pushUnique({
            label: nameStr,
            short: shortName || nameStr.slice(0, 6),
            full: `${s.zoneLabel || "무거동"} ${nameStr} — ${menuStr}`,
            loc: s.locName || "울산대학교 정문 (바보사거리)",
            tags
          });
        });
      }

      // 2) 교내 학식 + 바사·대학로·후문 일상 밥집/카페 풀 통합
      CAMPUS_DYNAMIC_MENU_POOL.forEach(pushUnique);
      return merged;
    }

    function getTodayCafeteriaRouletteItem() {
      try {
        const data = CAFETERIA.data || DEFAULT_CAFETERIA_DATA;
        const days = (data && data.days) || [];
        const todayIdx = getCafeteriaTodayIdx();
        const dayData = days[todayIdx] || days[0];
        if (!dayData) return null;
        const hour = new Date().getHours();
        const mealKey = hour < 10 ? "breakfast" : (hour < 14 ? "lunch" : "dinner");
        const mealList = dayData[mealKey] || dayData.lunch || [];
        const mainDishes = mealList.filter(it => !it.startsWith("[") && it !== "쌀밥" && !it.includes("김치") && !it.includes("단무지"));
        if (!mainDishes.length) return null;
        const dishPreview = mainDishes.slice(0, 2).map(s => s.replace(/\([^)]*\)/g, "").trim()).join("·");
        return {
          label: `오늘학식(${dishPreview.slice(0, 6)})`,
          short: "오늘의학식",
          full: `청운학사 오늘의 학식 (${dishPreview})`,
          loc: "청운학사(기숙사)",
          tags: ["solo", "all"]
        };
      } catch (e) {
        return null;
      }
    }

            { label: "돌돌파스타", short: "돌돌파스타", full: "무거동 돌돌파스타", loc: "22호관 학생회관" },
            { label: "가무댕댕 카레", short: "일본카레", full: "무거동 가무댕댕 카레", loc: "22호관 학생회관" },
            { label: "서브웨이", short: "서브웨이", full: "서브웨이 샌드위치", loc: "22호관 학생회관" }
          ];
        }
        return state.custom_roulette_menus.slice(0, 6);
      }

      state.menu_boards_by_theme = state.menu_boards_by_theme || {};
      if (!forceShuffle && Array.isArray(state.menu_boards_by_theme[curTheme]) && state.menu_boards_by_theme[curTheme].length === 6) {
        state.active_menu_board = state.menu_boards_by_theme[curTheme];
        state.active_menu_board_theme = curTheme;
        return state.menu_boards_by_theme[curTheme];
      }

      const fullPool = getAllCampusRouletteMenuPool();
      const pool = fullPool.filter(m => m.tags.includes(curTheme));
      const todayCafe = getTodayCafeteriaRouletteItem();
      const candidates = [...pool];
      if (todayCafe && (curTheme === "all" || curTheme === "solo")) {
        candidates.unshift(todayCafe);
      }

      // Fisher-Yates shuffle
      const shuffled = [...candidates];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const tmp = shuffled[i];
        shuffled[i] = shuffled[j];
        shuffled[j] = tmp;
      }

      // If today's live cafeteria menu exists and we're in 'solo' or 'all', include it in one of the 6 slots
      let picked = shuffled.slice(0, 6);
      if (todayCafe && (curTheme === "solo" || curTheme === "all") && !picked.some(x => x.short === "오늘의학식")) {
        picked[0] = todayCafe;
      }
      state.menu_boards_by_theme[curTheme] = picked;
      state.active_menu_board = picked;
      state.active_menu_board_theme = curTheme;
      return picked;
    }

    function resetRouletteResultState() {

    function updateCustomMenuSlot(idx, val) {
      if (!Array.isArray(state.custom_roulette_menus)) buildMenuBoardForTheme("custom", false);
      const clean = String(val || "").trim().slice(0, 14) || `메뉴 ${idx + 1}`;

      };
      render();
    }

    let _isSpinningRoulette = false;
    let _currentWheelDeg = 0;
    let _rouletteRafId = null;

    function spinRouletteWheel() {
      if (_isSpinningRoulette) return;
      const mode = state.roulette_mode || "menu";
      const u = DB.users[state.user_id];
      if (!u) return;

      const st = getUserStatsAndBadges(state.user_id);
      if (mode === "reward") {
        const curTickets = (u.coffee_tickets !== undefined) ? u.coffee_tickets : st.coffeeTickets;
        if (curTickets <= 0) {
          return showToast("보유한 돌림판 티켓이 없어요! 위 출석체크를 누르거나 번개에 참여해 티켓을 받아보세요.");
        }
        u.coffee_tickets = Math.max(0, curTickets - 1);
      }

      const items = mode === "reward" ? REWARD_WHEEL_ITEMS : getActiveMenuItems();
      const winIdx = Math.floor(Math.random() * items.length);
      const sliceDeg = 360 / items.length;
      // 각 섹션의 중심 각도가 상단 핀(0도)에 오도록 회전 각도 계산
      const targetSectorCenter = winIdx * sliceDeg + (sliceDeg / 2);
      const extraSpins = 360 * 6;
      const startDeg = _currentWheelDeg;
      const targetDeg = startDeg + extraSpins + (360 - (startDeg % 360)) + (360 - targetSectorCenter);
      const totalDelta = targetDeg - startDeg;

      const wheelEl = document.getElementById("uldaemo-roulette-wheel");
      const pinEl = document.getElementById("uldaemo-roulette-pin");
      const centerBtnEl = document.getElementById("uldaemo-roulette-center-btn");
      const labelEls = wheelEl ? Array.from(wheelEl.querySelectorAll(".roulette-label-inner")) : [];

      _isSpinningRoulette = true;
      state.last_roulette_win_idx = null;

      if (wheelEl) wheelEl.classList.add("is-spinning");
      if (centerBtnEl) centerBtnEl.classList.add("is-spinning");
      labelEls.forEach(el => el.classList.remove("is-winner", "is-passing"));

      const reducedMotion = (typeof isReducedMotionPreferred === "function") && isReducedMotionPreferred();
      const duration = reducedMotion ? 80 : 3200;
      const startTs = performance.now();
      let lastPegTick = Math.floor(startDeg / 60);
      let pinKickAngle = 0;

      // 물리 감속 + 미세 탄성 정착(Overshoot settle) 커브
      function easeRouletteSpin(t) {
        if (t >= 1) return 1;
        // 5차 감속 곡선에 미세한 핀 걸림 정착 반동(0.0028) 결합
        const quintOut = 1 - Math.pow(1 - t, 5);
        const settleBounce = Math.sin(t * Math.PI * 2.5) * Math.pow(1 - t, 3.2) * 0.0032;
        return quintOut + settleBounce;
      }

      function finalizeRouletteSpin() {
        _isSpinningRoulette = false;
        _currentWheelDeg = targetDeg;
        if (wheelEl) {
          wheelEl.classList.remove("is-spinning");
          wheelEl.style.transform = `rotate(${_currentWheelDeg}deg)`;
        }
        if (pinEl) pinEl.style.transform = "translateX(-50%) rotate(0deg)";
        if (centerBtnEl) centerBtnEl.classList.remove("is-spinning");

        state.last_roulette_win_idx = winIdx;
        state.just_won_roulette = true;
        setTimeout(() => { state.just_won_roulette = false; }, 900);

        const won = items[winIdx];
        if (mode === "reward") {
          if (won.type === "boost") {
            u.boost_coupons = (u.boost_coupons || 0) + won.val;
            u.bonus_score = (u.bonus_score || 0) + 5;
          } else if (won.type === "extra_post") {
            u.extra_post_coupons = (u.extra_post_coupons || 0) + won.val;
            u.bonus_score = (u.bonus_score || 0) + 5;
          } else if (won.type === "temp") {
            const weekKey = "uldaemo_roulette_temp_" + state.user_id;
            const gainedSoFar = parseFloat(localStorage.getItem(weekKey) || "0");
            if (gainedSoFar < 0.3) {
              u.manner_temp = Math.min(60, Math.round(((u.manner_temp || 36.5) + 0.1) * 10) / 10);
              localStorage.setItem(weekKey, String(+(gainedSoFar + 0.1).toFixed(1)));
            }
            u.bonus_score = (u.bonus_score || 0) + 10;
          } else if (won.type === "boost_score") {
            u.boost_coupons = (u.boost_coupons || 0) + won.val;
            u.bonus_score = (u.bonus_score || 0) + (won.score || 10);
          } else if (won.type === "ticket") {
            u.coffee_tickets = (u.coffee_tickets || 0) + won.val;
          }
          u.updated_at = Date.now();
          state.last_roulette_result = won.full;
          state.last_roulette_desc = won.desc || "";
          showToast(`🎉 ${won.full}`);
        } else {
          state.last_roulette_result = won.full;
          state.last_roulette_desc = `추천 장소: ${won.loc || '22호관 학생회관'}`;
          state.last_roulette_menu = won;
          showToast(`🍴 오늘의 추천 메뉴: ${won.full}`);
        }

        try { if (navigator && typeof navigator.vibrate === "function") navigator.vibrate([25, 40, 45]); } catch (e) {}
        if (typeof fireConfetti === "function") fireConfetti();
        saveDB(true);
        render();
      }

      if (_rouletteRafId) cancelAnimationFrame(_rouletteRafId);

      function stepFrame(now) {
        const elapsed = Math.max(0, now - startTs);
        const p = Math.min(1, elapsed / duration);
        const eased = easeRouletteSpin(p);
        const curDeg = startDeg + totalDelta * eased;
        _currentWheelDeg = curDeg;

        if (wheelEl) {
          wheelEl.style.transform = `rotate(${curDeg}deg)`;
        }

        // 현재 상단 포인터(0도) 아래를 지나가는 섹션 인덱스 계산
        const normDeg = ((360 - (curDeg % 360)) + 360) % 360;
        const passingIdx = Math.floor(normDeg / sliceDeg) % items.length;

        // 원판 안의 모든 글자를 매 프레임 동시 역회전시켜 흔들림 없이 100% 수평 정방향 유지
        for (let i = 0; i < labelEls.length; i++) {
          const innerEl = labelEls[i];
          const baseAngle = parseFloat(innerEl.getAttribute("data-base-angle") || "0");
          innerEl.style.transform = `translate(-50%, -50%) rotate(${-(baseAngle + curDeg)}deg)`;
          if (p > 0.58 && p < 0.995) {
            if (i === passingIdx) innerEl.classList.add("is-passing");
            else innerEl.classList.remove("is-passing");
          }
        }

        // 60도 경계 핀(Peg) 통과 시 상단 포인터 틱 바운스(Tick-Bounce) 물리 연출
        const curPegTick = Math.floor(curDeg / 60);
        if (curPegTick !== lastPegTick && !reducedMotion) {
          lastPegTick = curPegTick;
          const speedFactor = Math.max(0.28, 1 - p * 0.72);
          pinKickAngle = -30 * speedFactor;
          try {
            if (p > 0.45 && navigator && typeof navigator.vibrate === "function") {
              navigator.vibrate(6);
            }
          } catch (e) {}
        } else {
          pinKickAngle *= 0.80;
          if (Math.abs(pinKickAngle) < 0.3) pinKickAngle = 0;
        }

        if (pinEl) {
          pinEl.style.transform = `translateX(-50%) rotate(${pinKickAngle.toFixed(1)}deg)`;
        }

        if (p < 1) {
          _rouletteRafId = requestAnimationFrame(stepFrame);
        } else {
          finalizeRouletteSpin();
        }
      }

      _rouletteRafId = requestAnimationFrame(stepFrame);
    }

                  <button type="button" class="btn" style="margin-top:8px; min-height:44px; font-size:var(--fs-xs); font-weight:700; padding:0 8px;" onclick="state.active_modal='create'; render();">

                  <button type="button" class="btn" style="margin-top:8px; min-height:44px; font-size:var(--fs-xs); font-weight:700; padding:0 8px;" onclick="handleDailyCheckin()">

                  </button>
                </div>
              </div>
            </div>
          ` : `
            <div>
              <!-- 모드 전환 탭: 공강 메뉴 추천 vs 리워드 룰렛 -->

                <button class="btn" style="flex:1; min-height:44px; padding:0 12px; font-size:var(--fs-sm); font-weight:800; background:${mode === 'menu' ? '#287D62' : '#FFFFFF'}; color:${mode === 'menu' ? '#FFFFFF' : 'var(--text-secondary)'}; border-color:${mode === 'menu' ? '#191F28' : '#E5EAE7'};" onclick="state.roulette_mode='menu'; resetRouletteResultState(); render();">

                </button>
                <button class="btn" style="flex:1; min-height:44px; padding:0 12px; font-size:var(--fs-sm); font-weight:800; background:${mode === 'reward' ? '#287D62' : '#FFFFFF'}; color:${mode === 'reward' ? '#FFFFFF' : 'var(--text-secondary)'}; border-color:${mode === 'reward' ? '#287D62' : '#E5EAE7'};" onclick="state.roulette_mode='reward'; resetRouletteResultState(); render();">
                  🎁 리워드 (티켓 ${st.coffeeTickets}장)
                </button>
              </div>

              ${mode === 'menu' ? `
                <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px; margin-bottom:12px;">
                  <div style="display:flex; gap:6px; flex-wrap:wrap;">
                    ${[
                      { k: 'all', label: '전체' },
                      { k: 'solo', label: '혼밥·학식' },
                      { k: 'group', label: '맛집' },
                      { k: 'soup', label: '국물' },
                      { k: 'cafe', label: '카페' },
                      { k: 'custom', label: '직접 입력' }
                    ].map(t => `
                      <button type="button" class="quick-chip ${curTheme === t.k ? 'active' : ''}" style="min-height:44px; padding:0 12px; font-size:var(--fs-xs);" onclick="changeMenuTheme('${t.k}')">${t.label}</button>
                    `).join("")}
                  </div>
                  ${curTheme !== 'custom' ? `
                    <button type="button" class="btn" style="width:auto; min-height:44px; padding:0 12px; font-size:var(--fs-xs); font-weight:700; color:#287D62; background:#EEF8F3; border-color:#C5E6D6; border-radius:var(--radius-chip);" onclick="shuffleMenuRoulette()">
                      🎲 다른 메뉴 뽑기
                    </button>
                  ` : ''}
                </div>
              ` : ''}

              <div style="display:flex; flex-direction:column; align-items:center; gap:16px; background:#F7F9F8; border:1px solid #E5EAE7; border-radius:var(--radius-card); padding:18px 14px;">
                <div class="roulette-stage">
                  <div id="uldaemo-roulette-pin" class="roulette-pin">
                    <svg width="26" height="30" viewBox="0 0 26 30" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <path d="M13 29L3.5 11.5C1.8 8.3 4.1 4.5 7.8 4.5H18.2C21.9 4.5 24.2 8.3 22.5 11.5L13 29Z" fill="#287D62" stroke="#FFFFFF" stroke-width="2.2" stroke-linejoin="round"/>
                      <circle cx="13" cy="9.5" r="3" fill="#FFFFFF"/>
                    </svg>
                  </div>
                  <div id="uldaemo-roulette-wheel" class="roulette-wheel" style="transform:rotate(${_currentWheelDeg}deg);">
                    ${items.map((it, idx) => {
                      const angle = idx * 60 + 30 - 90;
                      const rawTxt = String(it.short || it.label || "").replace(/^[^\w가-힣+]+/, "").split("(")[0].trim();
                      const shortCategoryTxt = rawTxt.split("·")[0].trim().slice(0, 6);
                      const counterDeg = -(angle + _currentWheelDeg);
                      const isDarkSlice = (idx === 0 || idx === 2 || idx === 4);
                      const txtColor = isDarkSlice ? "#FFFFFF" : "#191F28";
                      return `
                        <div class="roulette-label" style="transform: rotate(${angle}deg) translate(76px, 0);">
                          <div class="roulette-label-inner v3-slice-label" data-base-angle="${angle}" style="color:${txtColor}; transform: translate(-50%, -50%) rotate(${counterDeg}deg);">
                            <span style="color:${txtColor} !important;">${escHtml(shortCategoryTxt)}</span>
                          </div>
                        </div>
                      `;
                    }).join("")}
                  </div>
                  <button id="uldaemo-roulette-center-btn" class="roulette-center-btn" onclick="spinRouletteWheel()">
                    <span>GO</span>
                  </button>
                </div>

                ${mode === 'menu' && curTheme === 'custom' ? `
                  <div style="width:100%; display:grid; grid-template-columns: 1fr 1fr; gap:6px;">
                    ${items.map((it, i) => `
                      <div style="display:flex; align-items:center; gap:4px; background:#FFFFFF; border:1px solid #E5EAE7; border-radius:var(--radius-btn); padding:4px 8px;">
                        <span style="font-size:var(--fs-xs); font-weight:800; color:#287D62;">${circledNums[i]}</span>
                        <input type="text" value="${escHtml(it.label)}" maxlength="12" style="border:none; outline:none; width:100%; min-height:36px; font-size:var(--fs-sm); font-weight:600; color:var(--text-primary); background:transparent;" onchange="updateCustomMenuSlot(${i}, this.value)" />
                      </div>
                    `).join("")}
                  </div>
                ` : ''}

                ${state.last_roulette_result ? `
                  <div class="roulette-result-banner" style="width:100%; background:#EEF8F3; border:1.5px solid #287D62; border-radius:var(--radius-btn); padding:12px 14px;">
                    <div style="font-size:var(--fs-xs); font-weight:800; color:#287D62; margin-bottom:2px;">🎯 이번 룰렛 당첨 결과</div>
                    <div style="font-size:var(--fs-md); font-weight:800; color:var(--text-primary); line-height:1.4;">${escHtml(state.last_roulette_result)}</div>
                    ${state.last_roulette_desc ? `<div style="font-size:var(--fs-xs); color:var(--text-secondary); margin-top:3px;">${escHtml(state.last_roulette_desc)}</div>` : ''}
                    ${mode === 'menu' && state.last_roulette_menu ? `
                      <div style="margin-top:8px;">
                        <button class="btn btn-primary" style="min-height:44px; padding:4px 12px; font-size:var(--fs-sm);" onclick="openMeetupFromRouletteMenu()">
