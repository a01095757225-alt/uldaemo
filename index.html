              <span style="font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; background:${st.firstMeetupDone ? '#287D62' : '#E5EAE7'}; color:${st.firstMeetupDone ? '#FFFFFF' : '#6B7684'};">
                ${st.firstMeetupDone ? '달성 완료' : '진행중 (0/1)'}
              </span>
            </div>
            <div style="font-size:12px; color:#6B7684; margin-top:4px;">
              보상 · 활동 리워드 +15점 + 아메리카노 추첨권 1장
            </div>
          </div>

          <div class="quest-item ${(st.streakDays >= 3 || st.weeklyMeets >= 2) ? 'done' : ''}" style="background:#F7F9F8; border-color:#E5EAE7;">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px;">
              <div>
                <div style="font-size:13px; font-weight:700; color:#191F28;">
                  주간 챌린지 · 연속 출석 (${st.streakDays}/5일) & 주간 번개 (${st.weeklyMeets}/2회)
                </div>
                <div style="font-size:12px; color:#6B7684; margin-top:2px;">
                  보상 · 출석 시 활동 +3점 & 3일 출석마다 추첨권 +1장
                </div>
              </div>
              <button class="btn ${st.checkedInToday ? '' : 'btn-primary'}" style="width:auto; min-height:32px; padding:0 12px; font-size:11.5px; font-weight:700;" onclick="handleDailyCheckin()">
                ${st.checkedInToday ? '오늘 출석 완료' : '출석체크 (+3점)'}
              </button>
            </div>
            <div class="quest-progress-bg">
              <div class="quest-progress-fill" style="width:${Math.max(streakPct, weekMeetPct)}%;"></div>
            </div>
          </div>

          <div style="margin-top:14px; padding-top:12px; border-top:1px solid #F2F4F3;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
              <span style="font-size:14px; font-weight:800; color:#191F28;">이달의 활동 랭킹</span>
              <span style="font-size:12px; color:#287D62; font-weight:700;">내 점수 ${st.rewardScore}점</span>
            </div>
            ${leaderboard.map((item, idx) => {
              const isRewardTarget = idx < 3;
              const itemBadges = renderVerifiedBadgePills(item.uid, 2);
              return `
                <div class="rank-row ${idx === 0 ? 'top1' : ''}">
                  <div style="display:flex; align-items:center; gap:10px;">
                    <span style="font-size:12.5px; font-weight:800; min-width:28px; color:${idx < 3 ? '#287D62' : '#6B7684'};">${idx + 1}위</span>
                    <span style="font-size:18px;">${item.avatar}</span>
                    <div>
                      <div style="font-size:13px; font-weight:700; color:#191F28; display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
                        <span>${escHtml(item.nickname)}</span>
                        ${itemBadges}
                        ${item.uid === state.user_id ? `<span style="font-size:10.5px; background:#EEF8F3; color:#287D62; font-weight:700; padding:1px 6px; border-radius:4px;">나</span>` : ""}
                        ${isRewardTarget ? `<span style="font-size:10.5px; background:#EEF8F3; color:#287D62; font-weight:700; padding:1px 7px; border-radius:999px;">리워드 대상</span>` : ""}
                      </div>
                      <div style="font-size:11.5px; color:#6B7684; margin-top:2px;">만남 ${item.validMeets}회 · ${item.manner_temp.toFixed(1)}°C · 출석 ${item.streakDays}일</div>
                    </div>
                  </div>
                  <div style="font-size:13px; font-weight:800; color:#287D62;">${item.rewardScore}점</div>
                </div>
              `;
            }).join("")}
          </div>
        </div>
      `;
    }

    function renderProfileTab(user) {
      const myStats = getUserStatsAndBadges(state.user_id);
      const myVerifiedPills = renderVerifiedBadgePills(state.user_id, 4);
      return `
        <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:16px; padding-top:4px;">
          <div>
            <h1 style="font-size:24px; font-weight:800; color:#191F28; letter-spacing:-0.03em; line-height:1.25;">내 프로필</h1>
            <p style="font-size:13.5px; color:#6B7684; margin-top:4px; font-weight:500;">실시간 매너온도와 공식 안심 인증 뱃지를 관리하세요</p>
          </div>
          <button type="button" class="btn" style="width:auto; min-height:38px; padding:0 14px; border-radius:10px; font-size:12.5px; font-weight:700; color:#6B7684; border-color:#E5EAE7; background:#FFFFFF;" onclick="clearLogin()">로그아웃</button>
        </div>

        <div class="uldaemo-card">
          <div style="display:flex; align-items:center; gap:14px; margin-bottom:14px;">
            <div style="width:60px; height:60px; border-radius:50%; background:#EEF8F3; border:1.5px solid #287D62; display:flex; align-items:center; justify-content:center; font-size:30px; flex-shrink:0;">
              ${user.avatar.split(" ")[0]}
            </div>
            <div>
              <div style="font-size:19px; font-weight:800; color:#191F28; display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
                <span>${user.nickname}</span>
                ${myVerifiedPills}
                ${isCurrentUserAdmin() ? `<span style="font-size:11px; background:#EEF8F3; color:#287D62; font-weight:700; padding:2px 8px; border-radius:6px;">운영진</span>` : ""}
              </div>
              <div style="font-size:13px; color:#6B7684; margin-top:2px;">울산대학교 · ${user.department} · ${user.mbti}</div>
              <div style="margin-top:6px;"><span class="privacy-pill-mini">이메일 · 실명 비공개 보호중</span></div>
            </div>
          </div>

          <div style="background:#F7F9F8; border-radius:10px; padding:11px 14px; font-size:13px; color:#191F28; margin-bottom:14px;">
            "${user.bio || "공강 시간에 함께 소통할 학우들을 환영합니다."}"
          </div>

          <!-- 1) 매너온도: 실시간 매너 점수표 -->
          <div style="background:#FFFFFF; border:1px solid #E5EAE7; border-radius:12px; padding:14px; margin-bottom:12px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; flex-wrap:wrap; gap:4px;">
              <span style="font-size:13px; font-weight:800; color:#191F28;">실시간 매너온도 (과정 · 점수표)</span>
              <span style="font-size:11.5px; color:#6B7684;">누적 만남 호평 <b style="color:#287D62;">${myStats.totalPraiseCnt}회</b></span>
            </div>
            ${renderTempGauge(user.manner_temp, false)}
            <div style="font-size:11.5px; color:#6B7684; margin-top:6px;">
              모든 학우가 36.5°C에서 시작하며, 실제 번개 모임 후 상대방의 칭찬(+0.5°C)과 노쇼 신고(-3.0°C)로만 변동됩니다.
            </div>
          </div>

          <!-- 2) 공식 인증 뱃지: 완전히 인증된 사람에게만 부여되는 보증 타이틀 -->
          <div style="background:#F7F9F8; border:1px solid #E5EAE7; border-radius:12px; padding:14px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; flex-wrap:wrap; gap:4px;">
              <div style="display:flex; align-items:center; gap:6px;">
                <span style="color:#287D62; display:inline-flex; align-items:center;">${getSvgIcon('shield', 15, '#287D62')}</span>
                <span style="font-size:13.5px; font-weight:800; color:#191F28;">공식 안심 인증 뱃지 (${myStats.badges.length}/4)</span>
              </div>
              <span style="font-size:11px; font-weight:700; color:#287D62; background:#EEF8F3; padding:2px 8px; border-radius:999px;">완전 검증 보증서</span>
            </div>
            <div style="font-size:12px; color:#6B7684; margin-bottom:12px;">
              출석·단순 참여로는 획득할 수 없으며, <b>40.0°C 달성</b> 또는 <b>만남 후 좋은 평가 15회 이상</b>을 받은 검증된 학우에게만 수여됩니다.
            </div>

            <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap:8px;">
              ${myStats.badgeCatalog.map(b => `
                <div style="background:#FFFFFF; border:1px solid ${b.earned ? '#287D62' : '#E5EAE7'}; border-radius:10px; padding:10px 12px;">
                  <div style="display:flex; justify-content:space-between; align-items:center; gap:6px; margin-bottom:4px;">
                    <span class="achieve-badge ${b.earned ? b.cls : ''}" style="${b.earned ? '' : 'background:#F7F9F8; color:#6B7684; border:1px solid #E5EAE7;'}">
                      ${getSvgIcon('shield', 11, b.earned ? (b.cls === 'achieve-verified' ? '#FFFFFF' : '#287D62') : '#6B7684', 2.3)}
                      <span>${escHtml(b.label)}</span>
                    </span>
                    <span style="font-size:11px; font-weight:800; color:${b.earned ? '#287D62' : '#6B7684'};">
                      ${b.earned ? '인증 완료' : b.progressText}
                    </span>
                  </div>
                  <div style="font-size:11.5px; color:#6B7684; margin-bottom:6px;">${escHtml(b.condText)}</div>
                  <div style="height:5px; background:#E5EAE7; border-radius:999px; overflow:hidden;">
                    <div style="width:${b.progressPct}%; height:100%; background:${b.earned ? '#287D62' : '#6B7684'}; border-radius:999px;"></div>
                  </div>
                </div>
              `).join("")}
            </div>
            <div style="font-size:11px; color:#6B7684; margin-top:10px;">
              * 노쇼 또는 비매너 신고가 1회라도 접수되면 보유 중인 모든 공식 인증 뱃지가 즉시 회수됩니다.
            </div>
          </div>

          <div id="fav-profile-badges">${renderFavBadgesHtml(user)}</div>
        </div>

        ${renderChallengeAndRewardCard()}

        <div class="uldaemo-card" id="fav-wrap">${renderFavSection(user)}</div>

        <div class="uldaemo-card">
          <div style="font-size:15px; font-weight:800; color:#191F28; margin-bottom:12px;">프로필 정보 수정</div>
          <label class="label">닉네임</label>
          <input id="edit_nick" class="input" value="${user.nickname}" />

          <label class="label">학과</label>
          <input id="edit_dept" class="input" value="${user.department}" />

          <div class="row-2">
            <div>
              <label class="label">프로필 아이콘</label>
              <select id="edit_avatar" class="select">
                ${AVATARS.map(a => `<option value="${a}" ${user.avatar.split(" ")[0] === a ? "selected" : ""}>${a}</option>`).join("")}
              </select>
            </div>
            <div>
              <label class="label">MBTI</label>
              <select id="edit_mbti" class="select">
                ${MBTIS.map(m => `<option value="${m}" ${user.mbti === m ? "selected" : ""}>${m}</option>`).join("")}
              </select>
            </div>
          </div>

          <label class="label">한줄 자기소개</label>
          <textarea id="edit_bio" class="textarea" rows="2">${user.bio || ""}</textarea>

          <button class="btn btn-primary" onclick="saveProfileEdit()">변경사항 저장하기</button>
        </div>
      `;
    }

    // =========================================================
    // 9-B. 관심 만남 카테고리 (새 번개가 올라오면 알림)
    // =========================================================
    const FAV_PRESETS = ["밥약", "카공", "게임", "술/번개", "운동", "산책", "택시/카풀", "스터디", "코노/노래방", "보드게임"];
    function catKey(s) {
      return String(s || "").replace(/^[^\w가-힣]+/, "").trim().toLowerCase();
    }
    function catMatches(a, b) {
      const x = catKey(a), y = catKey(b);
      if (!x || !y) return false;
      return x === y || x.includes(y) || y.includes(x);
    }
    function getFavList(user) {
      const favs = (user && user.fav_cats) || [];
      const customs = favs.filter(f => !FAV_PRESETS.some(p => catKey(p) === catKey(f)));
      return FAV_PRESETS.concat(customs);
    }
    function renderFavSection(user) {
      const favs = user.fav_cats || [];
      const muted = user.fav_muted || [];
      const list = getFavList(user);
      const isEditing = Boolean(state.editing_fav_cats) || favs.length === 0;

      if (!isEditing) {
        const activeNotifCnt = favs.filter(f => !muted.some(m => catKey(m) === catKey(f))).length;
        return `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
            <div style="font-size:15px; font-weight:800; color:#191F28;">관심 만남 카테고리</div>
            <button class="btn" style="width:auto; min-height:32px; padding:0 12px; font-size:12px; font-weight:700; color:#287D62; border-color:#C5E6D6; background:#EEF8F3;" onclick="startEditFavCats()">카테고리 편집</button>
          </div>
          <div style="font-size:12.5px; color:#6B7684; margin-bottom:12px;">선택한 카테고리의 새 번개가 올라오면 알림으로 알려드립니다.</div>
          <div style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:6px;">
            ${favs.map(c => {
              const idxInList = list.findIndex(item => catKey(item) === catKey(c));
              const isMuted = muted.some(m => catKey(m) === catKey(c));
              const cleanCat = String(c).replace(/^[^\w가-힣]+/, "").trim() || c;
              return `<span style="display:inline-flex; align-items:center; gap:6px; background:#EEF8F3; border:1px solid #C5E6D6; border-radius:999px; padding:4px 8px 4px 12px;">
                <span style="font-size:12.5px; font-weight:700; color:#287D62;">${escHtml(cleanCat)}</span>
                <button class="btn" style="width:auto; min-height:24px; padding:2px 8px; font-size:11px; border-radius:999px; border-color:#E5EAE7; background:#FFFFFF; color:#6B7684;" onclick="toggleFavMute(${idxInList})">${isMuted ? "알림 꺼짐" : "알림 켜짐"}</button>
              </span>`;
            }).join("")}
          </div>
          <div style="font-size:11.5px; color:#6B7684; margin-top:6px;">관심 카테고리 ${favs.length}개 · 알림 ${activeNotifCnt}개 활성</div>
        `;
      }

      return `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
          <div style="font-size:15px; font-weight:800; color:#191F28;">관심 만남 카테고리 설정</div>
          ${favs.length > 0 ? `<button class="btn btn-primary" style="width:auto; min-height:32px; padding:0 12px; font-size:12px;" onclick="finishEditFavCats()">설정 완료</button>` : ""}
        </div>
        <div style="font-size:12.5px; color:#6B7684; margin-bottom:12px;">원하는 카테고리를 선택한 뒤 설정 완료를 누르면 새 모임 등록 시 알림을 받을 수 있습니다.</div>
        <div style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;">
          ${list.map((c, i) => {
            const on = favs.some(f => catKey(f) === catKey(c));
            const cleanCat = String(c).replace(/^[^\w가-힣]+/, "").trim() || c;
            return `<button class="cat-btn ${on ? 'active' : ''}" onclick="toggleFavCat(${i})">${escHtml(cleanCat)}</button>`;
          }).join("")}
        </div>
        <div style="display:grid; grid-template-columns: 3fr 1fr; gap:6px; margin-bottom:10px;">
          <input id="fav_custom_in" class="input" style="margin-bottom:0;" placeholder="직접 카테고리 추가 (예: 영화, 밴드)" onkeydown="if(event.key==='Enter') addCustomFav()" />
          <button class="btn" onclick="addCustomFav()">+ 추가</button>
        </div>
        ${favs.length > 0 ? `
          <button class="btn btn-primary" style="min-height:38px;" onclick="finishEditFavCats()">선택 완료 (${favs.length}개 저장)</button>
        ` : `
          <div style="font-size:11.5px; color:#6B7684;">위 카테고리 중 1개 이상 선택해 보세요.</div>
        `}
      `;
    }
    function startEditFavCats() {
      state.editing_fav_cats = true;
      refreshFavSection();
    }
    function finishEditFavCats() {
      state.editing_fav_cats = false;
      showToast("✅ 관심 카테고리 설정이 저장되었습니다!");
      refreshFavSection();
    }
    function refreshFavSection() {
      const wrap = document.getElementById("fav-wrap");
      const badgeWrap = document.getElementById("fav-profile-badges");
      const u = DB.users[state.user_id];
      if (wrap && u) wrap.innerHTML = renderFavSection(u);
      if (badgeWrap && u) badgeWrap.innerHTML = renderFavBadgesHtml(u);
    }
    function toggleFavCat(i) {
      const u = DB.users[state.user_id];
      if (!u) return;
      const c = getFavList(u)[i];
      if (!c) return;
      u.fav_cats = u.fav_cats || [];
      state.editing_fav_cats = true;
      const idx = u.fav_cats.findIndex(f => catKey(f) === catKey(c));
      if (idx >= 0) {
        u.fav_cats.splice(idx, 1);
        u.fav_muted = (u.fav_muted || []).filter(m => catKey(m) !== catKey(c));
      } else {
        u.fav_cats.push(c);
        showToast(`⭐ '${c}' 선택됨! 다 고르셨다면 [✅ 설정 완료]를 눌러주세요.`);
      }
      u.updated_at = Date.now();
      saveDB(true);
      refreshFavSection();
    }
    function toggleFavMute(i) {
      const u = DB.users[state.user_id];
      if (!u) return;
      const c = getFavList(u)[i];
      if (!c) return;
      u.fav_muted = u.fav_muted || [];
      const idx = u.fav_muted.findIndex(m => catKey(m) === catKey(c));
      if (idx >= 0) { u.fav_muted.splice(idx, 1); showToast(`🔔 '${c}' 알림을 켰어요.`); }
      else { u.fav_muted.push(c); showToast(`🔕 '${c}' 알림을 껐어요.`); }
      u.updated_at = Date.now();
      saveDB(true);
      refreshFavSection();
    }
    function addCustomFav() {
      const inp = document.getElementById("fav_custom_in");
      const u = DB.users[state.user_id];
      if (!inp || !u) return;
      const v = inp.value.trim();
      if (catKey(v).length < 1) return showToast("추가할 카테고리 이름을 입력해주세요.");
      if (v.length > 20) return showToast("카테고리는 20자 이내로 입력해주세요.");
      u.fav_cats = u.fav_cats || [];
      if (u.fav_cats.some(f => catKey(f) === catKey(v))) return showToast("이미 등록된 카테고리예요.");
      u.fav_cats.push(v);
      state.editing_fav_cats = true;
      u.updated_at = Date.now();
      saveDB(true);
      showToast(`⭐ '${v}' 관심 카테고리로 추가됨!`);
      refreshFavSection();
    }
    // 새 번개가 올라오면 해당 카테고리를 관심으로 둔 다른 학우에게 알림
    function notifyFavCategory(post) {
      try {
        Object.values(DB.users || {}).forEach(u => {
          if (!u || u.student_id === post.author_id) return;
          const favs = u.fav_cats || [];
          if (!favs.length) return;
          const muted = u.fav_muted || [];
          const hit = favs.find(f => catMatches(f, post.category) && !muted.some(m => catKey(m) === catKey(f)));
          if (!hit) return;
          notifyUser(u.student_id, `⭐ 관심 카테고리 [${post.category}] 새 번개! "${post.title}" · 📍${post.location} ${post.meet_time}`, post.id);
        });
      } catch (e) {}
    }

    function saveProfileEdit() {
      const nick = document.getElementById("edit_nick").value.trim();
      const dept = document.getElementById("edit_dept").value.trim();
      const avatar = document.getElementById("edit_avatar").value;
      const mbti = document.getElementById("edit_mbti").value;
      const bio = document.getElementById("edit_bio").value.trim();
      if (!nick || !dept) return showToast("닉네임과 학과(필수 항목)를 비워둘 수 없습니다.");

      const u = DB.users[state.user_id];
      u.nickname = nick;
      u.department = dept;
      u.avatar = avatar.split(" ")[0];
      u.mbti = mbti;
      u.bio = bio;
      u.updated_at = Date.now();
      saveDB(true);
      showToast("✅ 프로필이 업데이트되었습니다!");
      render();
    }

    render();
    pullFromCloud(true);
    setInterval(() => { pullFromCloud(false); }, 4000);
  </script>
</body>
</html>
